name: Deploy Sarmad to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: sarmad-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/676932025599/locations/global/workloadIdentityPools/github-sarmad/providers/github-main
          token_format: access_token
          project_id: saemad-8a204
          service_account: github-hosting-sarmad@saemad-8a204.iam.gserviceaccount.com
      - name: Deploy Hosting only
        run: npx --yes firebase-tools@15.37.0 deploy --only hosting --project saemad-8a204 --non-interactive
