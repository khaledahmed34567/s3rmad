/* Layout concept: monochrome Swiss grid. Giant logo mask as signature, one signal-red accent, hairline rules, a layered "stack" diagram in the hero. */
:root{
  --bg:#fbf7ec; --bg2:#f3ecd9; --bg3:#e9dfc5; --fg:#1b2b25; --muted:#68705f; --line:#e6dcc0; --line2:#cdbf98;
  --accent:#0f6b56; --accent-soft:#e2eee3; --accent-ink:#fbf7ec; --gold:#b8892b; --gold-ink:#2a1e05; --ok:#2e7d32; --warn:#b45309;
  --inv-bg:#0f2f28; --inv-fg:#f7f0dd; --inv-muted:#a9b9ad; --inv-line:#25483e;
  --shadow:0 1px 2px rgba(27,43,37,.06),0 12px 32px -12px rgba(27,43,37,.2);
  --r:14px; --r-sm:9px;
  --f-ar:'Mabroum','Outfit',system-ui,sans-serif; --f-en:'Outfit','Mabroum',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1f1b; --bg2:#12291f; --bg3:#183429; --fg:#f4ecd6; --muted:#a9b3a3; --line:#1f3a31; --line2:#305245;
  --accent:#d9ae55; --accent-soft:#2a2a17; --accent-ink:#1d1604; --gold:#d9ae55; --gold-ink:#1d1604; --ok:#6fcf7a; --warn:#fbbf24;
  --inv-bg:#f4ecd6; --inv-fg:#10241f; --inv-muted:#5c6a5f; --inv-line:#d8cca9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1f1b; --bg2:#12291f; --bg3:#183429; --fg:#f4ecd6; --muted:#a9b3a3; --line:#1f3a31; --line2:#305245;
  --accent:#d9ae55; --accent-soft:#2a2a17; --accent-ink:#1d1604; --gold:#d9ae55; --gold-ink:#1d1604; --ok:#6fcf7a; --warn:#fbbf24;
  --inv-bg:#f4ecd6; --inv-fg:#10241f; --inv-muted:#5c6a5f; --inv-line:#d8cca9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.6); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html[lang="ar"]{--f:var(--f-ar);--wb:500;--wh:800}
html[lang="en"]{--f:var(--f-en);--wb:400;--wh:700}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:var(--wb);font-size:16px;line-height:1.75;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
a{color:inherit;text-decoration:none}
img,svg,video{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3,h4{font-weight:var(--wh);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{letter-spacing:0}
p{margin:0}
.mono{font-family:var(--mono);font-size:.82em;letter-spacing:.02em;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-block:clamp(56px,9vw,112px)}
.sec.alt{background:var(--bg2)}
.sec.inv{background:var(--inv-bg);color:var(--inv-fg);--muted:var(--inv-muted);--line:var(--inv-line)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:18px}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--gold)}
.h-display{font-size:clamp(2.5rem,7.2vw,5.4rem);line-height:1.08}
.h1{font-size:clamp(2.1rem,5vw,3.6rem)} .h2{font-size:clamp(1.7rem,3.6vw,2.6rem)} .h3{font-size:1.25rem}
.lead{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--muted);max-width:62ch}
.muted{color:var(--muted)} .sm{font-size:.9rem} .xs{font-size:.8rem}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.sec-head>div{max-width:720px}
.stack{display:grid;gap:16px} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:20px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
[dir="rtl"] .flip{transform:scaleX(-1)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:.8em 1.35em;border-radius:999px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);font-weight:var(--wh);font-size:.95rem;line-height:1.2;transition:transform .15s,background .15s,color .15s,border-color .15s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line2)} .btn.ghost:hover{border-color:var(--fg)}
.btn.sm{padding:.55em 1em;font-size:.85rem} .btn.block{width:100%}
.btn[disabled],.btn.off{opacity:.5;pointer-events:none}
.link{display:inline-flex;gap:8px;align-items:center;font-weight:var(--wh);border-bottom:1.5px solid var(--gold);padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:.28em .8em;border-radius:999px;border:1px solid var(--line2);font-size:.82rem;background:transparent;color:var(--fg)}
button.chip:hover{border-color:var(--fg)} .chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:.15em .65em;border-radius:6px;background:var(--bg3);font-size:.75rem;font-family:var(--mono);color:var(--muted);direction:ltr}
.tag.free{background:var(--gold);color:var(--gold-ink)} .tag.soon{background:var(--accent-soft);color:var(--accent)} .tag.ok{color:var(--ok)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:border-color .2s,transform .2s,box-shadow .2s}
.card.hov:hover{border-color:var(--fg);transform:translateY(-3px);box-shadow:var(--shadow)}
.alt .card{background:var(--bg)}
.card .ic{width:46px;height:46px;border-radius:12px;background:var(--bg3);display:grid;place-items:center;font-size:1.3rem}
.card .ic.red{background:var(--accent);color:var(--accent-ink)}
/* header */
.strip{background:var(--inv-bg);color:var(--inv-fg);font-size:.8rem}
.strip .wrap{display:flex;gap:4px;align-items:center;min-height:36px;overflow-x:auto;scrollbar-width:none}
.strip a{padding:.35em .85em;border-radius:999px;opacity:.7;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.strip a:hover,.strip a.on{opacity:1;background:color-mix(in srgb,var(--inv-fg) 14%,transparent)}
.strip .sp{flex:1}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:80;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:22px;min-height:68px}
.logo{display:block;width:var(--lw,112px);aspect-ratio:4.861;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.nav{display:flex;gap:2px;margin-inline-start:8px;flex:1;min-width:0}
.nav a,.nav button{padding:.5em .8em;white-space:nowrap;border-radius:999px;font-weight:var(--wh);font-size:.93rem;background:none;border:0;display:inline-flex;gap:6px;align-items:center}
.nav a:hover,.nav button:hover,.nav .on{background:var(--bg3)}
.nav .on{color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:grid;place-items:center}
.ib:hover{border-color:var(--fg)}
.burger{display:none}
@media(max-width:1120px){.nav{display:none}.burger{display:grid}.hdr .wrap{gap:12px}.hide-m{display:none!important}.logo{--lw:98px}.tools{margin-inline-start:auto}}
.menu-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 10px);inset-inline-start:0;min-width:280px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:8px;z-index:20;display:none}
.menu-wrap.open .pop{display:grid;gap:2px}
.pop a{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px;border-radius:10px;border:0}
.pop a:hover{background:var(--bg2)}
.pop a .ic{grid-row:span 2;width:38px;height:38px;border-radius:10px;background:var(--bg3);display:grid;place-items:center}
.pop a small{color:var(--muted);font-weight:var(--wb);line-height:1.5}
.drawer{position:fixed;inset:0;z-index:120;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;display:flex;flex-direction:column;gap:6px;animation:rise .25s both}
.drawer a{padding:14px 6px;font-size:1.35rem;font-weight:var(--wh);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.announce{background:var(--inv-bg);color:var(--inv-fg);font-size:.88rem}
.announce .wrap{display:flex;gap:14px;align-items:center;justify-content:center;min-height:40px;padding-block:6px;text-align:center}
.announce button{background:none;border:0;opacity:.8;margin-inline-start:auto}
/* hero */
.hero{padding-block:clamp(40px,7vw,96px) clamp(48px,7vw,88px);position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.95fr);gap:clamp(28px,5vw,72px);align-items:center}
@media(max-width:940px){.hero-grid{grid-template-columns:minmax(0,1fr)}}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .cta{margin-top:32px}
.hero-meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:44px;padding-top:24px;border-top:1px solid var(--line)}
.hero-meta b{display:block;font-size:1.6rem;line-height:1.2} .hero-meta span{font-size:.82rem;color:var(--muted)}
.layers{border:1px solid var(--line2);border-radius:20px;background:var(--bg);box-shadow:var(--shadow);overflow:hidden}
.layers-top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg2)}
.layers-top i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line2);margin-inline-end:5px}
.lyr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;position:relative}
.lyr+.lyr{border-top:1px solid var(--line)}
.lyr .n{font-family:var(--mono);font-size:.8rem;color:var(--muted);width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);display:grid;place-items:center}
.lyr b{display:block;font-size:1.05rem;line-height:1.4}
.lyr .mono{color:var(--muted)}
.lyr.tam{background:var(--accent-soft)} .lyr.tam .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lyr::after{content:"";position:absolute;inset-inline-start:41px;top:-1px;width:2px;height:12px;background:var(--gold);opacity:0;animation:flow 4.8s infinite}
.lyr:nth-child(2)::after{animation-delay:.0s}.lyr:nth-child(3)::after{animation-delay:1.2s}.lyr:nth-child(4)::after{animation-delay:2.4s}.lyr:nth-child(5)::after{animation-delay:3.6s}
@keyframes flow{0%{opacity:0;transform:translateY(-18px)}12%{opacity:1}28%{opacity:0;transform:translateY(8px)}100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view{animation:rise .35s both}
/* portals */
.portal{display:flex;flex-direction:column;gap:14px;padding:26px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-height:230px;position:relative;overflow:hidden}
.portal:hover{border-color:var(--fg)}
.portal .big{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.portal .go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-weight:var(--wh)}
/* app cards */
.app{display:flex;flex-direction:column;gap:16px;padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-width:0}
.app-top{display:flex;gap:16px;align-items:flex-start}
.app-ico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:1.6rem;font-weight:var(--wh);flex:none;background:var(--fg);color:var(--bg)}
.app-ico.c1{background:var(--accent);color:var(--accent-ink)} .app-ico.c2{background:var(--bg3);color:var(--fg)}
.dl{display:flex;flex-wrap:wrap;gap:8px}
.dl .btn{padding:.5em .95em;font-size:.82rem;gap:8px}
.dl .btn.soon{opacity:.55;border-style:dashed;pointer-events:none}
.os-pick{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
/* cover */
.cover{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.cover svg.art{position:absolute;inset:0;width:100%;height:100%}
.cover b{position:relative;font-size:1.25rem;line-height:1.3;max-width:80%;text-wrap:balance}
.cover .tag{position:absolute;top:14px;inset-inline-start:14px;background:rgba(0,0,0,.35);color:#fff;backdrop-filter:blur(6px)}
.course{display:flex;flex-direction:column;gap:14px;padding:12px 12px 22px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-width:0}
.course>:not(.cover){padding-inline:10px}
.course:hover{border-color:var(--fg)}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.meta span{display:inline-flex;gap:6px;align-items:center}
.price{font-size:1.4rem;font-weight:var(--wh)}
.bar{height:6px;border-radius:99px;background:var(--bg3);overflow:hidden} .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
/* blog */
.post{display:flex;flex-direction:column;gap:12px;padding:0 0 22px;border-bottom:1px solid var(--line);min-width:0}
.post-art{aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;background:var(--bg3)}
.post-art svg{position:absolute;inset:0;width:100%;height:100%}
.post:hover h3{color:var(--accent)}
.prose{max-width:70ch;font-size:1.08rem;line-height:2}
.prose h2{font-size:1.6rem;margin:2.2em 0 .6em} .prose p{margin:0 0 1.2em} .prose ul{padding-inline-start:1.4em;margin:0 0 1.4em} .prose li{margin-bottom:.4em}
.prose pre,.codebox{background:var(--inv-bg);color:var(--inv-fg);border-radius:var(--r-sm);padding:18px 20px;overflow-x:auto;font-family:var(--mono);font-size:.84rem;line-height:1.75;direction:ltr;text-align:left;margin:0 0 1.4em}
.callout{border-inline-start:3px solid var(--accent);background:var(--bg2);padding:16px 20px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:0 0 1.4em}
[dir="rtl"] .callout{border-radius:var(--r-sm) 0 0 var(--r-sm)}
/* forms */
.field{display:grid;gap:7px} .field label,.lbl{font-size:.88rem;font-weight:var(--wh)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:.8em 1em;width:100%;min-width:0;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--fg)}
input[readonly]{background:var(--bg2)}
textarea{min-height:130px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
.err{color:var(--accent);font-size:.85rem;min-height:1.2em}
.form{display:grid;gap:18px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px} @media(max-width:640px){.f2{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1.5px solid var(--line2);border-radius:var(--r-sm);cursor:pointer}
.opt:hover{border-color:var(--fg)} .opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--ok)} .opt.bad{border-color:var(--accent)}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:.2s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--accent)} .sw input:checked+i::after{inset-inline-start:23px}
/* auth */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:calc(100vh - 150px)}
.auth-side{background:var(--inv-bg);color:var(--inv-fg);padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-main{padding:clamp(28px,5vw,64px);display:grid;align-content:center}
.auth-box{max-width:440px;width:100%;margin-inline:auto;display:grid;gap:22px}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth-side{display:none}}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:12px 16px;font-weight:var(--wh);color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.acc{border-top:1px solid var(--line)} .acc details{border-bottom:1px solid var(--line)}
.acc summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:var(--wh);font-size:1.08rem;display:flex;justify-content:space-between;gap:16px;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:1.5rem;font-family:var(--mono);color:var(--accent);transition:transform .2s}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc details>div{padding:0 0 22px;color:var(--muted);max-width:72ch}
/* learning */
.learn{display:grid;grid-template-columns:320px minmax(0,1fr);gap:0;min-height:calc(100vh - 110px)}
.learn-side{border-inline-end:1px solid var(--line);background:var(--bg2);padding:22px 18px;position:sticky;top:calc(68px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 68px);overflow:auto}
.learn-main{padding:clamp(20px,4vw,48px);min-width:0}
.mod{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:20px 8px 8px}
.les{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;width:100%;background:none;border:0;text-align:start}
.les:hover{background:var(--bg3)} .les.on{background:var(--bg);box-shadow:0 0 0 1.5px var(--fg)}
.les .st{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;font-size:.7rem}
.les.done .st{background:var(--ok);border-color:var(--ok);color:#fff} .les.lock{opacity:.55}
.les small{display:block;color:var(--muted);line-height:1.3}
@media(max-width:940px){.learn{grid-template-columns:1fr}.learn-side{position:static;max-height:none;border-inline-end:0;border-bottom:1px solid var(--line)}}
.blk{display:grid;gap:14px;margin-bottom:34px}
.blk-h{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
video,audio{width:100%;border-radius:var(--r-sm);background:#000} audio{background:none}
.audio-card{display:grid;gap:12px;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2)}
.pdf-box{border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.pdf-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pdf-pages{max-height:620px;overflow:auto;padding:16px;display:grid;gap:14px;justify-items:center}
.pdf-pages canvas{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);max-width:100%;height:auto!important}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:16px;border:1px solid var(--line);border-radius:var(--r-sm)}
.task.done{background:var(--bg2)}
.q{padding:22px;border:1px solid var(--line);border-radius:var(--r);display:grid;gap:12px}
.score{display:flex;gap:16px;align-items:center;padding:20px;border-radius:var(--r);background:var(--accent-soft)}
.score b{font-size:2rem;color:var(--accent)}
/* modal */
.back{position:fixed;inset:0;z-index:150;background:rgba(10,10,12,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;overflow:auto;animation:rise .2s both}
.modal{background:var(--bg);border-radius:20px;border:1px solid var(--line2);width:100%;max-width:520px;box-shadow:var(--shadow);overflow:hidden}
.modal.wide{max-width:680px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-b{padding:22px;display:grid;gap:18px}
.testbar{background:var(--accent-soft);color:var(--accent);padding:10px 22px;font-size:.84rem;display:flex;gap:10px;align-items:center}
.sum{display:grid;gap:8px;padding:16px;border-radius:var(--r-sm);background:var(--bg2)}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{border-top:1px solid var(--line2);padding-top:10px;font-weight:var(--wh);font-size:1.1rem}
.paytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmd{align-items:start;padding-top:12vh}
.cmd .modal{max-width:620px}
.cmd input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 22px;font-size:1.05rem}
.cmd-list{max-height:50vh;overflow:auto;padding:8px}
.cmd-it{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;width:100%;background:none;border:0;text-align:start}
.cmd-it.on,.cmd-it:hover{background:var(--bg2)}
.cmd-it .tag{margin-inline-start:auto}
.toasts{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;z-index:200;pointer-events:none;padding-inline:16px}
.toast{background:var(--inv-bg);color:var(--inv-fg);padding:.8em 1.3em;border-radius:99px;box-shadow:var(--shadow);animation:rise .25s both;max-width:90vw}
.cookie{position:fixed;inset-inline:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;z-index:140;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;display:grid;gap:12px;animation:rise .3s both}
/* account */
.acc-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px}
@media(max-width:860px){.acc-grid{grid-template-columns:1fr;gap:20px}}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.8rem;font-weight:var(--wh)}
.list{display:grid;border-top:1px solid var(--line)} .list>div{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.link-card{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:var(--r)}
.link-card.on{border-color:var(--accent);background:var(--accent-soft)}
/* pricing */
.plan{display:flex;flex-direction:column;gap:18px;padding:30px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.plan.hot{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg);--muted:var(--inv-muted);--line:var(--inv-line)}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li svg{color:var(--accent);margin-top:.3em}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border-top:2px solid var(--fg)}
.steps>div{padding:20px 16px 0 0;position:relative} [dir="rtl"] .steps>div{padding:20px 0 0 16px}

@media(max-width:940px){.steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 0;border-top:0}.steps>div{border-top:2px solid var(--fg)}}
.band{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:center}
@media(max-width:860px){.band{grid-template-columns:1fr}}
.band .btn{border-color:var(--accent-ink);color:var(--accent-ink)} .band .btn.primary{background:var(--accent-ink);color:var(--accent)}
/* footer */
.ftr{background:var(--inv-bg);color:var(--inv-fg);--muted:var(--inv-muted);--line:var(--inv-line);padding-top:72px;overflow:hidden}
.ftr-grid{display:grid;grid-template-columns:1.4fr repeat(4,minmax(0,1fr));gap:36px;padding-bottom:56px}
@media(max-width:940px){.ftr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ftr-grid>:first-child{grid-column:1/-1}}
.ftr h4{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:16px;font-weight:500}
.ftr ul{list-style:none;padding:0;margin:0;display:grid;gap:10px} .ftr a:hover{color:var(--accent)}
.ftr .field input{background:transparent;border-color:var(--line);color:var(--inv-fg)}
.ftr-bottom{border-top:1px solid var(--line);padding-block:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.wordmark{display:block;width:min(100%,1100px);margin:24px auto 0;aspect-ratio:4.861;background:var(--inv-fg);opacity:.95;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.tbl table{width:100%;border-collapse:collapse;min-width:520px} .tbl th,.tbl td{padding:14px 18px;text-align:start;border-bottom:1px solid var(--line)} .tbl th{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;background:var(--bg2)}
.empty{padding:48px 20px;text-align:center;border:1.5px dashed var(--line2);border-radius:var(--r);color:var(--muted);display:grid;gap:12px;justify-items:center}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-sm);background:var(--bg2);font-size:.88rem;color:var(--muted)}
.note svg{color:var(--accent);margin-top:.25em}
.crumb{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:20px;flex-wrap:wrap}
.crumb a:hover{color:var(--accent)}

/* command palette */
function searchIndex() {
  const out = [];
  [['home', T('الرئيسية', 'Home')], ['services', T('الخدمات', 'Services')], ['apps', T('التطبيقات وروابط التحميل', 'Apps and downloads')], ['platform', T('سرمد بلاتفورم', 'Sarmad Platform')], ['learning', T('سرمد ليرننج', 'Sarmad Learning')], ['tam', T('تم - بوابة الدفع', 'Tam - payment gateway')], ['pricing', T('الأسعار', 'Pricing')], ['about', T('من نحن', 'About')], ['contact', T('تواصل معنا', 'Contact')], ['login', T('تسجيل الدخول', 'Sign in')], ['signup', T('إنشاء حساب', 'Create account')]].forEach(([h, t]) => out.push({ t, sub: T('صفحة', 'Page'), h, k: 'zap' }));
  SERVICES.forEach(s => out.push({ t: L(s.t), sub: T('خدمة', 'Service'), h: 'services', k: s.icon }));
  APPS.forEach(a => out.push({ t: L(a.name), sub: T('تطبيق', 'App'), h: 'apps', k: 'monitor', x: L(a.d) }));
  COURSES.forEach(c => out.push({ t: L(c.t), sub: T('كورس', 'Course'), h: 'course-' + c.id, k: 'book', x: L(c.d) }));
  POSTS.forEach(p => out.push({ t: L(p.t), sub: T('مقال', 'Article'), h: 'post-' + p.id, k: 'pen', x: L(p.ex) }));
  return out;
}
function openSearch() {
  const idx = searchIndex(); let sel = 0, list = idx;
  const b = openModal(`<input id="cmd-q" placeholder="${T('ابحث في الخدمات والتطبيقات والكورسات والمقالات', 'Search services, apps, courses and articles')}" autocomplete="off" aria-label="search"><div class="cmd-list" id="cmd-list"></div>`);
  b.classList.add('cmd');
  const draw = () => {
    $('#cmd-list').innerHTML = list.length ? list.slice(0, 12).map((x, i) => `<button class="cmd-it ${i === sel ? 'on' : ''}" data-h="${x.h}">${icon(x.k)}<span>${esc(x.t)}</span><span class="tag">${x.sub}</span></button>`).join('') : `<div class="empty" style="border:0">${T('لا نتائج', 'No results')}</div>`;
    fixDigits($('#cmd-list'));
  };
  const q = $('#cmd-q'); q.focus(); draw();
  q.addEventListener('input', () => { const v = q.value.trim().toLowerCase(); list = v ? idx.filter(x => (x.t + ' ' + (x.x || '')).toLowerCase().includes(v)) : idx; sel = 0; draw(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, Math.min(list.length, 12) - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter' && list[sel]) { closeModal(); go(list[sel].h); }
  });
  $('#cmd-list').addEventListener('click', e => { const it = e.target.closest('[data-h]'); if (it) { closeModal(); go(it.dataset.h); } });
}

/* PDF viewer (pdf.js, loaded on demand) */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfBoot = null, pdfDocs = {}, pdfZoom = 1;
const addScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s); });
async function ensurePdfJs() {
  if (!pdfBoot) pdfBoot = (async () => { await addScript(PDFJS + 'pdf.min.js'); await addScript(PDFJS + 'pdf.worker.min.js'); window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; })();
  return pdfBoot;
}
async function drawPdf() {
  const box = $('.pdf-box'); if (!box) return; const pages = $('#pdf-pages'), info = $('#pdf-info'), src = box.dataset.pdf;
  try {
    await ensurePdfJs();
    if (!pdfDocs[src]) { const buf = await (await fetch(src)).arrayBuffer(); pdfDocs[src] = await window.pdfjsLib.getDocument({ data: buf }).promise; }
    const doc = pdfDocs[src]; pages.innerHTML = ''; const dpr = Math.min(window.devicePixelRatio || 1, 2); const avail = Math.max(240, pages.clientWidth - 32);
    for (let i = 1; i <= doc.numPages; i++) {
      const pg = await doc.getPage(i), v1 = pg.getViewport({ scale: 1 }), sc = avail / v1.width * pdfZoom, vp = pg.getViewport({ scale: sc * dpr });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; cv.style.width = (vp.width / dpr) + 'px'; cv.style.height = (vp.height / dpr) + 'px';
      pages.appendChild(cv); await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    }
    info.textContent = `${doc.numPages} ${T('صفحات', 'pages')} · ${Math.round(pdfZoom * 100)}%`; fixDigits(info);
  } catch (e) { pages.innerHTML = `<div class="empty" style="grid-column:1/-1">${T('تعذر فتح الملف. تأكد من الرابط ومن اتصالك بالإنترنت.', 'Could not open the file. Check the link and your connection.')}</div>`; if (info) info.textContent = ''; }
}

  async markDone(el) {
    if (!S.user) return needAuth();
    const { c, l } = el.dataset; const cur = S.prog[c] && S.prog[c].lessons[l] && S.prog[c].lessons[l].done;
    await saveLesson(c, l, { done: !cur }); render();
  },
  speed(el) { const a = $('#la'); if (a) a.playbackRate = +el.dataset.v; $$('[data-act=speed]').forEach(x => x.classList.toggle('on', x === el)); },
  pdfZoom(el) { pdfZoom = Math.min(2.2, Math.max(.5, pdfZoom + +el.dataset.v)); drawPdf(); },
  async retryQuiz(el) { await saveLesson(el.dataset.c, el.dataset.l, { quiz: null }); render(); }
};
const CH = {
  async toggleLink(el) { S.user = await DB.setLink(el.dataset.v, el.checked); render(); toast(el.checked ? T('تم الربط', 'Linked') : T('تم الفصل', 'Unlinked')); },
  async taskToggle(el) {
    if (!S.user) { el.checked = false; return needAuth(); }
    const { c, l, t } = el.dataset; const cur = ((S.prog[c] && S.prog[c].lessons[l] && S.prog[c].lessons[l].tasks) || {});
    const tasks = { ...cur, [t]: el.checked }; const course = COURSES.find(x => x.id === c), lesson = allLessons(course).find(x => x.id === l);
    const all = lesson.tasks.every(x => tasks[x.id]);
    await saveLesson(c, l, { tasks, ...(all && !lesson.submit ? { done: true } : {}) }); render();
  }
};
document.addEventListener('click', e => {
  if (!e.target.closest('.menu-wrap')) $$('.menu-wrap.open').forEach(x => x.classList.remove('open'));
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (f) { f(el, e); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CH[el.dataset.change]) CH[el.dataset.change](el); });
document.addEventListener('input', e => {
  if (e.target.id === 'pf-q') { S.filter.q = e.target.value; $('#post-list').innerHTML = postList(); fixDigits($('#post-list')); }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  if (e.key === 'Escape') { closeModal(); closeDrawer(); $$('.menu-wrap.open').forEach(x => x.classList.remove('open')); }
});

/* ---------- forms ---------- */
const FORMS = {
  async news(f) { const em = $('#news-email').value.trim(); if (!em) return; await DB.subscribe(em); f.reset(); toast(T('شكرًا، تم اشتراكك', 'Thanks, you are subscribed')); },
  async contact(f) {
    const d = new FormData(f); const msg = { type: 'quote', services: d.getAll('svc'), budget: d.get('budget'), timeline: d.get('timeline'), name: d.get('name'), email: d.get('email'), phone: d.get('phone'), message: d.get('message') };
    await DB.sendMessage(msg); S.msgs = await DB.messages();
    f.outerHTML = `<div class="card" style="align-self:start"><div class="ic red">${icon('check')}</div><h2 class="h2" style="font-size:1.6rem">${T('استلمنا طلبك', 'We got your request')}</h2><p class="muted">${T('سنراجع التفاصيل ونرد عليك بخطة وتقدير.', 'We will review the details and reply with a plan and an estimate.')}</p><div><a class="btn primary" href="#home">${T('العودة للرئيسية', 'Back to home')}</a></div></div>`;
    fixDigits($('#main')); toast(T('تم إرسال الطلب', 'Request submitted'));
  },
  async career(f) { const d = new FormData(f); await DB.sendMessage({ type: 'career', name: d.get('name'), email: d.get('email'), role: d.get('role'), link: d.get('link') }); f.reset(); toast(T('وصلنا طلبك، شكرًا', 'We received your application, thank you')); },
  async login(f) {
    const d = new FormData(f), err = $('#auth-err');
    try { await DB.login({ id: d.get('id'), password: d.get('password') }); await loadState(); const n = S.next || 'account'; S.next = null; toast(T('أهلًا بعودتك', 'Welcome back')); go(n); }
    catch (e) { err.textContent = T('البيانات غير صحيحة. تحقق من البريد وكلمة المرور.', 'Details do not match. Check your email and password.'); }
  },
  async signup(f) {
    const d = new FormData(f), err = $('#auth-err');
    if (d.get('password') !== d.get('password2')) { err.textContent = T('كلمتا المرور غير متطابقتين.', 'Passwords do not match.'); return; }
    try { await DB.register({ name: d.get('name'), email: d.get('email'), phone: d.get('phone'), password: d.get('password') }); await loadState(); const n = S.next || 'account'; S.next = null; toast(T('تم إنشاء حسابك', 'Your account is ready')); go(n); }
    catch (e) { err.textContent = e.message === 'exists' ? T('هذا البريد أو الهاتف مسجل بالفعل.', 'This email or phone is already registered.') : T('تعذر إنشاء الحساب. حاول مرة أخرى.', 'Could not create the account. Try again.'); }
  },
  async profile(f) { const d = new FormData(f); S.user = await DB.updateProfile({ name: d.get('name').trim(), phone: d.get('phone').trim() }); renderHeader(); toast(T('تم الحفظ', 'Saved')); render(); },
  async quiz(f) {
    if (!S.user) return needAuth();
    const c = COURSES.find(x => x.id === f.dataset.c), l = allLessons(c).find(x => x.id === f.dataset.l), d = new FormData(f);
    const answers = l.quiz.map((q, i) => (d.get('q' + i) === null ? -1 : +d.get('q' + i)));
    if (answers.includes(-1)) { $('#quiz-err').textContent = T('أجب عن كل الأسئلة قبل الإرسال.', 'Answer every question before submitting.'); return; }
    const score = answers.filter((a, i) => a === l.quiz[i].a).length;
    await saveLesson(c.id, l.id, { quiz: { answers, score, total: l.quiz.length }, ...(score / l.quiz.length >= .5 ? { done: true } : {}) }); render();
  },
  async submission(f) { if (!S.user) return needAuth(); const d = new FormData(f); await saveLesson(f.dataset.c, f.dataset.l, { submission: d.get('text'), done: true }); toast(T('تم حفظ التسليم', 'Submission saved')); render(); }
};
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (!fn) return;
  const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try { await fn(f); } catch (err) { toast(T('حدث خطأ، حاول مرة أخرى', 'Something went wrong, try again')); }
  if (btn && btn.isConnected) btn.disabled = false;
});
addEventListener('hashchange', render);

/* ---------- boot ---------- */
(async function boot() {
  lang = ls.get('lang', 'ar'); applyLang(); applyTheme();
  try { await loadState(); } catch (e) { }
  renderAll();
})();

</script>

</body></html>
