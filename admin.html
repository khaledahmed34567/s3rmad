<style>
/* عناوين — headings */
@font-face{font-family:'AppTitles';src:url('https://files.catbox.moe/236lzl.ttf') format('truetype'),url('https://files.catbox.moe/va4cz0.otf') format('opentype');font-weight:700;font-display:swap;}
/* نصوص — body text: رفيع (light/regular) + ضخم (bold), same family, two weights */
@font-face{font-family:'AppBody';src:url('https://files.catbox.moe/4rjalb.otf') format('opentype');font-weight:400;font-display:swap;}
@font-face{font-family:'AppBody';src:url('https://files.catbox.moe/uqr0yx.otf') format('opentype');font-weight:700;font-display:swap;}
/* التواريخ والوقت — dates & time */
@font-face{font-family:'AppSub';src:url('https://files.catbox.moe/yzud6z.otf') format('opentype');font-weight:400;font-display:swap;}

:root{
  --canvas:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7F6F3; --ink:#151510; --ink-soft:#6B6A60;
  --line:#EBE8E0; --emerald:#155FDB; --emerald-soft:#155FDB12; --gold:#C6A87D; --gold-soft:#C6A87D1c;
  --danger:#B23A34; --danger-soft:#B23A3414; --radius-lg:22px; --radius-md:14px; --radius-sm:10px;
  --shadow-soft:0 1px 2px rgba(21,20,15,.03), 0 10px 26px -12px rgba(21,20,15,.10);
  --shadow-lift:0 4px 8px rgba(21,20,15,.05), 0 22px 44px -16px rgba(21,20,15,.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{overflow-x:hidden;}
html,body{margin:0; padding:0; background:var(--canvas); color:var(--ink); max-width:100%;}
body{overflow-x:hidden; font-family:'AppBody','SF Pro Arabic','Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; min-height:100dvh;}
h1,h2,h3,.title{font-family:'AppTitles','AppBody',sans-serif; font-weight:700; margin:0; letter-spacing:-.01em;}
label,.sub,.eyebrow{font-family:'AppSub','AppBody',sans-serif;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:100px; border:2px solid var(--canvas);}
*{scrollbar-width:thin; scrollbar-color:var(--line) transparent;}
.icon{width:17px; height:17px; display:inline-block; flex-shrink:0;}
.icon svg{width:100%; height:100%;}

.warn-banner{background:#FFF7E6; border-bottom:1px solid #F0DDA8; color:#7A5B10; font-size:12.5px; padding:9px 16px; text-align:center; line-height:1.7;}

.shell{display:flex; min-height:100dvh;}
.sidebar{width:230px; flex-shrink:0; border-left:1px solid var(--line); padding:18px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100dvh; overflow-y:auto;}
.sidebar .brand{display:flex; align-items:center; gap:9px; padding:8px 10px 20px;}
.sidebar .brand img{height:22px; width:auto; filter:none;}
.sidebar .brand span{font-family:'AppTitles'; font-size:16px;}
.navbtn{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-sm); border:none; background:transparent; text-align:right; cursor:pointer; color:var(--ink-soft); font-size:14px; font-family:inherit;}
.navbtn:hover{background:var(--surface-2);}
.navbtn.active{background:var(--emerald-soft); color:var(--emerald); font-weight:600;}
.content{flex:1; min-width:0; padding:26px 28px 60px;}
.content-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
.content-head h1{font-size:22px;}
@media(max-width:820px){
  .shell{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; border-left:none; border-bottom:1px solid var(--line); padding:10px;}
  .sidebar .brand{display:none;}
  .navbtn{flex-shrink:0;}
  .content{padding:18px 16px 50px;}
  .panel{padding:16px;}
  .table-wrap{margin:0 -16px; padding:0 16px;}
  .btn{min-height:44px;}
  .btn-sm{min-height:38px; padding:0 14px;}
  .content-head h1{font-size:19px;}
  .field-row{flex-direction:column;}
  .field-row .field{min-width:0;}
}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:40px; padding:0 18px; border-radius:100px; border:1px solid transparent; font-size:14px; font-weight:590; cursor:pointer; transition:transform .12s ease, opacity .15s ease, background .15s ease; white-space:nowrap; font-family:inherit;}
.btn:active{transform:scale(.95); opacity:.85;}
.btn-primary{background:var(--emerald); color:#fff;}
.btn-ghost{background:var(--surface-2); color:var(--ink);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-gold{background:var(--gold); color:#241d10;}
.btn-sm{min-height:32px; padding:0 13px; font-size:12.5px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.stat-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px; text-align:center; box-shadow:var(--shadow-soft);}
.stat-box .stat-icon{color:var(--emerald); display:flex; justify-content:center; margin-bottom:8px;}
.stat-box .stat-num{font-family:'AppTitles'; font-size:24px;}
.stat-box .stat-lbl{font-size:11px; color:var(--ink-soft); margin-top:4px;}
@media(max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow-soft); margin-bottom:22px;}
.panel h3{font-size:15.5px; margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field input[type=email],.field input[type=tel],.field input[type=url],.field textarea,.field select{
  width:100%; padding:10px 13px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--canvas);
  color:var(--ink); font-size:14px; font-family:inherit;
}
.field input[type=file]{width:100%; font-size:13px;}
.field textarea{min-height:70px; resize:vertical;}
.field-row{display:flex; gap:12px; flex-wrap:wrap;}
.skill-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.skill-row input{flex:1; min-width:0;}
.skill-row .skill-remove{flex-shrink:0; width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--danger); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.field-row .field{flex:1; min-width:160px;}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
img.preview{width:70px; height:70px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid var(--line); margin-top:6px;}

table.rows{width:100%; border-collapse:collapse; min-width:560px;}
table.rows th{text-align:right; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.rows td{padding:10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
table.rows tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -22px; padding:0 22px;}
.badge{display:inline-flex; padding:4px 10px; border-radius:100px; font-size:11.5px; font-weight:600;}
.badge.pending{background:var(--gold-soft); color:#8a6d3b;}
.badge.approved,.badge.issued{background:var(--emerald-soft); color:var(--emerald);}
.badge.rejected{background:var(--danger-soft); color:var(--danger);}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}
.thumb-sm{width:40px; height:40px; border-radius:8px; object-fit:cover; border:1px solid var(--line);}

.qblock,.tblock{border:1px solid var(--line); border-radius:var(--radius-md); padding:14px; margin-bottom:10px; background:var(--surface-2);}
.qblock .opt-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.qblock .opt-row input[type=text]{flex:1;}
.qblock .qhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.tblock{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap;}
.tblock textarea{flex:2; min-width:180px;}
.tblock select,.tblock input[type=color]{flex:0 0 auto;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--canvas); padding:12px 20px; border-radius:100px; font-size:13.5px; z-index:200; opacity:0; pointer-events:none; transition:all .3s ease; box-shadow:var(--shadow-lift);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.empty{text-align:center; padding:30px; color:var(--ink-soft); font-size:13.5px;}
</style>
</head>

function stripUndefined(obj){
  // Firestore rejects `undefined` field values outright (throws a client-side
  // 'invalid-argument' error) — this keeps that from ever reaching the SDK.
  // FieldValue.delete() sentinels are real objects, not undefined, so they
  // pass through untouched.
  const out = {};
  for (const k in obj) if (obj[k] !== undefined) out[k] = obj[k];
  return out;
}
const DB = {
  async listAll(collection, whereField, whereValue){
    let ref = fbDb.collection(collection);
    if (whereField) ref = ref.where(whereField, '==', whereValue);
    const snap = await ref.get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async get(collection, id){
    const doc = await fbDb.collection(collection).doc(id).get();
    return doc.exists ? { id: doc.id, ...doc.data() } : null;
  },
  async create(collection, data, id){
    const clean = stripUndefined(data);
    if (id) { await fbDb.collection(collection).doc(id).set(clean); return { id }; }
    const ref = await fbDb.collection(collection).add(clean);
    return { id: ref.id };
  },
  async update(collection, id, patch){
    await fbDb.collection(collection).doc(id).set(stripUndefined(patch), { merge: true });
    return { id };
  },
  async remove(collection, id){
    await fbDb.collection(collection).doc(id).delete();
    return { id };
  },
};
function friendlyError(e){
  const code = e && (e.code || '');
  if (code === 'permission-denied') return 'لا يوجد صلاحية وصول — تحقّق من Firestore Rules (لازم تسمح بالكتابة من غير تسجيل دخول لهذه اللوحة)';
  if (code === 'not-found' || code === 'failed-precondition') return 'قاعدة بيانات Firestore غير موجودة لهذا المشروع بعد';
  console.error(e);
  return `حدث خطأ: ${code || (e && e.message) || 'غير معروف'}`;
}
const ImgBB = {
  async upload(file){
    const fd = new FormData(); fd.append('image', file);
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${CONFIG.IMGBB_KEY}`, { method:'POST', body:fd });
    const json = await res.json();
    if (!json.success) throw new Error('ImgBB upload failed');
    return json.data.url;
  }
};

function genCode(len=8){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = 'RQM-';

}

async function saveTrack(){
  const btn = document.getElementById('trackSaveBtn');
  const name_ar = document.getElementById('trackName').value.trim();
  if (!name_ar){ toast('اكتب اسم المسار'); return; }
  btn.disabled = true; btn.textContent = '...جارٍ الحفظ';
  try {
    let icon_url;
    const file = document.getElementById('trackIcon').files[0];
    if (file) icon_url = await ImgBB.upload(file);
    const editId = document.getElementById('trackEditId').value;
    const data = {
      name_ar, name_en: document.getElementById('trackNameEn').value.trim(),
      description_ar: document.getElementById('trackDesc').value.trim(),
      description_en: document.getElementById('trackDescEn').value.trim(),
      status: document.getElementById('trackStatus').value,
      price: Number(document.getElementById('trackPrice').value)||0,
    };
    if (icon_url) data.icon_url = icon_url;
    if (editId) await DB.update('Tracks', editId, data);
    else await DB.create('Tracks', data);
    toast('تم الحفظ بنجاح'); renderTracksTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
function editTrack(id){
  const t = (window._tracksCache||[]).find(x=>x.id===id); if (!t) return;
  document.getElementById('trackFormTitle').textContent = 'تعديل المسار';
  document.getElementById('trackEditId').value = id;
  document.getElementById('trackName').value = t.name_ar||'';
  document.getElementById('trackNameEn').value = t.name_en||'';
  document.getElementById('trackDesc').value = t.description_ar||'';
  document.getElementById('trackDescEn').value = t.description_en||'';
  document.getElementById('trackStatus').value = t.status||'ongoing';
  document.getElementById('trackPrice').value = t.price||0;
  if (t.icon_url){ const p=document.getElementById('trackIconPreview'); p.src=t.icon_url; p.style.display='block'; }
  document.getElementById('trackCancelBtn').style.display='inline-flex';
  window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteTrack(id){
  if (!confirm('حذف هذا المسار؟ لن يحذف الدورات المرتبطة به تلقائيًا.')) return;
  try { await DB.remove('Tracks', id); toast('تم الحذف'); renderTracksTab(); } catch(e){ toast(friendlyError(e)); }
}

function onCourseCompletionTypeChange(){
  document.getElementById('courseBadgeFields').style.display = document.getElementById('courseCompletionType').value==='badge' ? 'block' : 'none';
}
/* ---- Skill rows: each row is one skill with an Arabic input paired with
   its English translation, instead of two separate free-text blobs. Stored
   the same way as before (comma-joined skills_ar / skills_en strings) so
   the certificate template on the student side needs no changes. */
function skillRowHtml(ar, en){
  return `<div class="skill-row">
    <input type="text" class="skillAr" placeholder="مهارة بالعربي" value="${escapeHtml(ar||'')}">
    <input type="text" class="skillEn" dir="ltr" placeholder="Skill in English" value="${escapeHtml(en||'')}">
    <button type="button" class="skill-remove" onclick="this.closest('.skill-row').remove()">${icon('trash')}</button>
  </div>`;
}
function renderSkillRows(pairs){
  const list = document.getElementById('courseSkillsList');
  list.innerHTML = pairs.length ? pairs.map(p=>skillRowHtml(p.ar, p.en)).join('') : '';
}
function addSkillRow(ar, en){
  document.getElementById('courseSkillsList').insertAdjacentHTML('beforeend', skillRowHtml(ar, en));
}
function collectSkillPairs(){
  return Array.from(document.querySelectorAll('#courseSkillsList .skill-row')).map(row => ({
    ar: row.querySelector('.skillAr').value.trim(),
    en: row.querySelector('.skillEn').value.trim(),
  })).filter(p => p.ar || p.en);
}
// splits the stored comma-separated strings back into paired rows for editing —
// pairs by position, so the order entered originally is preserved
function parseSkillsToPairs(skillsAr, skillsEn){
  const ars = (skillsAr||'').split(/[،,]/).map(s=>s.trim()).filter(Boolean);
  const ens = (skillsEn||'').split(',').map(s=>s.trim()).filter(Boolean);
  const len = Math.max(ars.length, ens.length);
  const pairs = [];
  for (let i=0; i<len; i++) pairs.push({ ar: ars[i]||'', en: ens[i]||'' });
  return pairs;
}
async function saveCourse(){
  const btn = document.getElementById('courseSaveBtn');
  const title_ar = document.getElementById('courseTitle').value.trim();
  const track_id = document.getElementById('courseTrack').value;
  if (!title_ar || !track_id){ toast('اختر المسار واكتب عنوان الدورة'); return; }
  btn.disabled = true; btn.textContent = '...جارٍ الحفظ';
  try {
    let cover_image_url;
    const file = document.getElementById('courseCover').files[0];
    if (file) cover_image_url = await ImgBB.upload(file);
    const completion_type = document.getElementById('courseCompletionType').value;
    let badge_image_url;
    if (completion_type==='badge') {
      const badgeFile = document.getElementById('courseBadgeImage').files[0];
      if (badgeFile) badge_image_url = await ImgBB.upload(badgeFile);
    }
    const editId = document.getElementById('courseEditId').value;
    const data = {
      title_ar, title_en: document.getElementById('courseTitleEn').value.trim(),
      track_id, instructor_name: document.getElementById('courseInstructor').value.trim(),
      description_ar: document.getElementById('courseDesc').value.trim(),
      description_en: document.getElementById('courseDescEn').value.trim(),
      notice: document.getElementById('courseNotice').value.trim(),
      skills_ar: collectSkillPairs().map(p=>p.ar).filter(Boolean).join('، '),
      skills_en: collectSkillPairs().map(p=>p.en).filter(Boolean).join(', '),
      accreditation_text_ar: document.getElementById('courseAccredTextAr').value.trim(),
      accreditation_text_en: document.getElementById('courseAccredTextEn').value.trim(),
      price: Number(document.getElementById('coursePrice').value)||0,
      status: document.getElementById('courseStatus').value,
      standalone: document.getElementById('courseStandalone').value === '1',
      completion_type,
      has_certificate: completion_type !== 'none', // kept for older checks that only ask "does this course grant anything"
      badge_name_x: Number(document.getElementById('courseBadgeNameX').value)||50,
      badge_name_y: Number(document.getElementById('courseBadgeNameY').value)||80,
      badge_name_size: Number(document.getElementById('courseBadgeNameSize').value)||28,
      badge_name_color: document.getElementById('courseBadgeNameColor').value||'#0E1116',
    };
    if (cover_image_url) data.cover_image_url = cover_image_url;
    if (badge_image_url) data.badge_image_url = badge_image_url;
    if (editId) await DB.update('Courses', editId, data);
    else await DB.create('Courses', data);
    toast('تم الحفظ بنجاح'); renderCoursesTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
function editCourse(id){
  const c = (window._coursesCache||[]).find(x=>x.id===id); if (!c) return;
  document.getElementById('courseFormTitle').textContent = 'تعديل الدورة';
  document.getElementById('courseEditId').value = id;
  document.getElementById('courseTrack').value = c.track_id||'';
  document.getElementById('courseInstructor').value = c.instructor_name||'';
  document.getElementById('courseTitle').value = c.title_ar||'';
  document.getElementById('courseTitleEn').value = c.title_en||'';
  document.getElementById('coursePrice').value = c.price||0;
  document.getElementById('courseDesc').value = c.description_ar||'';
  document.getElementById('courseDescEn').value = c.description_en||'';
  document.getElementById('courseNotice').value = c.notice||'';
  renderSkillRows(parseSkillsToPairs(c.skills_ar, c.skills_en));
  document.getElementById('courseAccredTextAr').value = c.accreditation_text_ar||'';
  document.getElementById('courseAccredTextEn').value = c.accreditation_text_en||'';
  document.getElementById('courseStatus').value = c.status||'ongoing';
  document.getElementById('courseStandalone').value = c.standalone===false ? '0' : '1';
  document.getElementById('courseCompletionType').value = c.completion_type || (c.has_certificate===false ? 'none' : 'certificate');
  document.getElementById('courseBadgeNameX').value = c.badge_name_x||50;
  document.getElementById('courseBadgeNameY').value = c.badge_name_y||80;
  document.getElementById('courseBadgeNameSize').value = c.badge_name_size||28;
  document.getElementById('courseBadgeNameColor').value = c.badge_name_color||'#0E1116';
  onCourseCompletionTypeChange();
  if (c.badge_image_url){ const p=document.getElementById('courseBadgeImagePreview'); p.src=c.badge_image_url; p.style.display='block'; }
  if (c.cover_image_url){ const p=document.getElementById('courseCoverPreview'); p.src=c.cover_image_url; p.style.display='block'; }
  document.getElementById('courseCancelBtn').style.display='inline-flex';
  window.scrollTo({top:0, behavior:'smooth'});
}

  try { await DB.remove('Courses', id); toast('تم الحذف'); renderCoursesTab(); } catch(e){ toast(friendlyError(e)); }
}

async function saveTask(){
  const btn = document.getElementById('taskSaveBtn');
  const title_ar = document.getElementById('taskTitle').value.trim();
  const lecture_id = document.getElementById('taskLecture').value;
  const type = document.getElementById('taskType').value;
  if (!title_ar || !lecture_id){ toast('اختر المحاضرة واكتب عنوان المهمة'); return; }
  btn.disabled = true; btn.textContent = '...جارٍ الحفظ';
  try {
    const editId = document.getElementById('taskEditId').value;
    // FieldValue.delete() is only valid inside update()/set(merge:true) calls —
    // using it while creating a brand-new document throws "invalid-argument"
    // (Firestore rejects a delete sentinel on a field that doesn't exist yet).
    // So the "clear the other type's fields" sentinels are only added on edits.
    const clearOtherFields = editId ? firebase.firestore.FieldValue.delete() : undefined;
    const data = { title_ar, lecture_id, type, order: Number(document.getElementById('taskOrder').value)||1, min_minutes: Number(document.getElementById('taskMinMinutes').value)||0 };
    if (['video','audio','pdf'].includes(type)){
      data.content_url = document.getElementById('taskContentUrl').value.trim();
      if (editId){ data.content_json = clearOtherFields; data.quiz_data = clearOtherFields; }
    } else if (type==='text'){
      if (!textBlocks.length){ toast('أضف جزء نص واحد على الأقل'); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      data.content_json = textBlocks.map(b=>({ text:b.text, color:b.color, animation:b.animation||'' }));
      if (editId){ data.content_url = clearOtherFields; data.quiz_data = clearOtherFields; }
    } else if (type==='assignment'){
      data.instructions = document.getElementById('taskAssignmentInstructions').value.trim();
      if (editId){ data.content_url = clearOtherFields; data.content_json = clearOtherFields; data.quiz_data = clearOtherFields; }
    } else if (type==='essay'){
      data.instructions = document.getElementById('taskEssayPrompt').value.trim();
      data.min_words = Number(document.getElementById('taskEssayMinWords').value)||0;
      if (!data.instructions){ toast('اكتب سؤال المقال'); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      if (editId){ data.content_url = clearOtherFields; data.content_json = clearOtherFields; data.quiz_data = clearOtherFields; }
    } else if (type==='audio_response'){
      data.instructions = document.getElementById('taskAudioPrompt').value.trim();
      if (!data.instructions){ toast('اكتب المطلوب تسجيله'); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      if (editId){ data.content_url = clearOtherFields; data.content_json = clearOtherFields; data.quiz_data = clearOtherFields; }
    } else if (type==='matching'){
      const pairs = matchingPairs.filter(p=>p.left.trim() && p.right.trim());
      if (pairs.length < 2){ toast('أضف زوجين على الأقل'); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      data.content_json = { pairs };
      if (editId){ data.content_url = clearOtherFields; data.quiz_data = clearOtherFields; }
    } else if (type==='ordering'){
      const steps = orderingSteps.map(v=>v.trim()).filter(Boolean);
      if (steps.length < 2){ toast('أضف خطوتين على الأقل'); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      data.content_json = { steps };
      if (editId){ data.content_url = clearOtherFields; data.quiz_data = clearOtherFields; }
    } else if (type==='fillblank'){
      const text = document.getElementById('fillblankText').value.trim();
      const blanksCount = (text.match(/___/g)||[]).length;
      const answers = fillblankAnswers.map(v=>v.trim());
      if (!text || blanksCount===0){ toast('اكتب النص وحط ___ مكان كل فراغ'); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      if (blanksCount !== answers.filter(Boolean).length){ toast(`عدد الفراغات (___) هو ${blanksCount} لازم يطابق عدد الإجابات المكتوبة`); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      data.content_json = { text, answers };
      if (editId){ data.content_url = clearOtherFields; data.quiz_data = clearOtherFields; }
    } else if (type==='flashcards'){
      const cards = flashcards.filter(c=>c.front.trim() && c.back.trim());
      if (!cards.length){ toast('أضف بطاقة واحدة على الأقل'); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      data.content_json = { cards };
      if (editId){ data.content_url = clearOtherFields; data.quiz_data = clearOtherFields; }
    } else if (type==='truefalse'){
      const statements = truefalseItems.filter(it=>it.text.trim());
      if (!statements.length){ toast('أضف عبارة واحدة على الأقل'); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      data.content_json = { statements };
      if (editId){ data.content_url = clearOtherFields; data.quiz_data = clearOtherFields; }
    } else if (type==='quiz'){
      if (!quizQuestions.length){ toast('أضف سؤال واحد على الأقل'); btn.disabled=false; btn.innerHTML=`${icon('plus')} حفظ`; return; }
      data.quiz_data = {
        questions: quizQuestions.map(q=>({ q:q.q, options:q.options, correct:q.correct })),
        time_limit_minutes: Number(document.getElementById('quizTimeLimit').value)||10,
        max_attempts: Number(document.getElementById('quizMaxAttempts').value)||3,
        pass_percent: Number(document.getElementById('quizPassPercent').value)||75,
      };
      if (editId){ data.content_url = clearOtherFields; data.content_json = clearOtherFields; }
    }
    if (editId) await DB.update('Tasks', editId, data);
    else await DB.create('Tasks', data);
    toast('تم الحفظ بنجاح'); renderTasksTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
function editTask(id){
  const t = (window._tasksCache||[]).find(x=>x.id===id); if (!t) return;
  document.getElementById('taskFormTitle').textContent = 'تعديل المهمة';
  document.getElementById('taskEditId').value = id;
  document.getElementById('taskLecture').value = t.lecture_id||'';
  document.getElementById('taskOrder').value = t.order||1;
  document.getElementById('taskType').value = t.type||'video';
  document.getElementById('taskTitle').value = t.title_ar||'';
  document.getElementById('taskMinMinutes').value = t.min_minutes||0;
  document.getElementById('taskContentUrl').value = t.content_url||'';
  document.getElementById('taskAssignmentInstructions').value = t.type==='assignment' ? (t.instructions||'') : '';
  document.getElementById('taskEssayPrompt').value = t.type==='essay' ? (t.instructions||'') : '';
  document.getElementById('taskEssayMinWords').value = t.min_words||'';
  document.getElementById('taskAudioPrompt').value = t.type==='audio_response' ? (t.instructions||'') : '';
  onTaskTypeChange();
  textBlocks = Array.isArray(t.content_json) ? t.content_json.map(b=>({...b})) : [];
  renderTextBlocks();
  matchingPairs = (t.type==='matching' && t.content_json?.pairs) ? t.content_json.pairs.map(p=>({...p})) : [];
  renderMatchingPairs();
  orderingSteps = (t.type==='ordering' && t.content_json?.steps) ? [...t.content_json.steps] : [];
  renderOrderingSteps();
  document.getElementById('fillblankText').value = (t.type==='fillblank' && t.content_json?.text) ? t.content_json.text : '';
  fillblankAnswers = (t.type==='fillblank' && t.content_json?.answers) ? [...t.content_json.answers] : [];
  renderFillblankAnswers();
  flashcards = (t.type==='flashcards' && t.content_json?.cards) ? t.content_json.cards.map(c=>({...c})) : [];
  renderFlashcards();
  truefalseItems = (t.type==='truefalse' && t.content_json?.statements) ? t.content_json.statements.map(s=>({...s})) : [];
  renderTruefalse();
  quizQuestions = (t.quiz_data && Array.isArray(t.quiz_data.questions)) ? t.quiz_data.questions.map(q=>({...q, options:[...q.options]})) : [];
  renderQuizQuestions();
  if (t.quiz_data){
    document.getElementById('quizTimeLimit').value = t.quiz_data.time_limit_minutes||10;
    document.getElementById('quizMaxAttempts').value = t.quiz_data.max_attempts||3;
    document.getElementById('quizPassPercent').value = t.quiz_data.pass_percent||75;
  }
  document.getElementById('taskCancelBtn').style.display='inline-flex';
  window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteTask(id){
  if (!confirm('حذف هذه المهمة؟')) return;
  try { await DB.remove('Tasks', id); toast('تم الحذف'); renderTasksTab(); } catch(e){ toast(friendlyError(e)); }
}

async function revokeCert(id){
  const reason = prompt('سبب الإلغاء/سحب الاعتماد (اختياري، هيظهر لو حد فتح رابط التحقق):') || '';
  if (!confirm('تأكيد الإلغاء؟ لن يعتبر هذا المستند صالحًا بعد ذلك عند التحقق منه.')) return;
  try {
    await DB.update('Certificates', id, { status:'revoked', revoke_reason: reason.trim(), revoked_at: new Date().toISOString() });
    toast('تم الإلغاء'); renderCertificatesTab();
  } catch(e){ toast(friendlyError(e)); }
}
async function restoreCert(id){
  try {
    await DB.update('Certificates', id, { status:'issued', revoke_reason:'' });
    toast('تمت الاستعادة'); renderCertificatesTab();
  } catch(e){ toast(friendlyError(e)); }
}
async function saveCert(){
  const btn = document.getElementById('certSaveBtn');
  const cert_type = document.getElementById('certType').value;
  const full_name_ar = document.getElementById('certName').value.trim();
  const full_name_en = document.getElementById('certNameEn').value.trim();
  const user_email = document.getElementById('certEmail').value.trim();
  const course_id = document.getElementById('certCourse').value;
  const track_id = document.getElementById('certTrack').value;
  const verify_code = document.getElementById('certCode').value.trim();
  const language = document.getElementById('certLang').value;
  if (cert_type==='badge') {
    if (!full_name_en || !user_email || !verify_code || !course_id){ toast('اكتب الاسم بالإنجليزي واختر الدورة'); return; }
  } else if ((!full_name_ar && language!=='en') || (!full_name_en && language!=='ar') || !user_email || !verify_code){ toast('أكمل كل الحقول المطلوبة للغة المختارة'); return; }
  if ((cert_type==='course'||cert_type==='accreditation') && !course_id){ toast('اختر الدورة'); return; }
  if (cert_type==='track' && !track_id){ toast('اختر المسار'); return; }
  btn.disabled = true; btn.textContent = '...جارٍ الحفظ';
  try {
    let file_url;
    const file = document.getElementById('certFile').files[0];
    if (file) file_url = await ImgBB.upload(file);
    const editId = document.getElementById('certEditId').value;
    const status = document.getElementById('certStatus').value;
    const data = {
      full_name_ar, full_name_en, user_email, verify_code, language, status, cert_type,
      issued_at: status==='issued' ? new Date().toISOString() : '',
    };
    if (cert_type==='track') {
      data.track_id = track_id;
      data.completed_courses = Array.from(document.querySelectorAll('.certTrackCourseChk:checked')).map(el=>el.value);
      data.overall_grade = document.getElementById('certGrade').value.trim();
    } else if (cert_type==='badge' || cert_type==='accreditation') {
      data.course_id = course_id;
    } else {
      data.course_id = course_id;
      data.skills_ar = document.getElementById('certSkillsAr').value.trim();
      data.skills_en = document.getElementById('certSkillsEn').value.trim();
    }
    if (file_url) data.file_url = file_url;
    if (editId) await DB.update('Certificates', editId, data);
    else await DB.create('Certificates', data);
    if (status==='issued') {
      // best-effort notification — look up the user_id from the saved record
      try {
        const target = editId ? (await DB.get('Certificates', editId)) : null;
        if (target && target.user_id) await DB.create('Notifications', {
          user_id: target.user_id, title:'شهادتك جاهزة', message:`تم اعتماد شهادتك، اضغط للعرض`,
          link:`certificate/${verify_code}`, read:'FALSE', created_at:new Date().toISOString(),
        });
      } catch(e){ console.error(e); }
    }
    toast('تم الحفظ بنجاح'); renderCertificatesTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
function editCert(id){
  const c = (window._certsCache||[]).find(x=>x.id===id); if (!c) return;
  document.getElementById('certFormTitle').textContent = 'تعديل الشهادة';
  document.getElementById('certEditId').value = id;
  document.getElementById('certType').value = c.cert_type==='track' ? 'track' : 'course';
  document.getElementById('certEmail').value = c.user_email||'';
  document.getElementById('certCourse').value = c.course_id||'';
  document.getElementById('certTrack').value = c.track_id||'';
  document.getElementById('certName').value = c.full_name_ar||'';
  document.getElementById('certNameEn').value = c.full_name_en||'';
  // A pending request created by the student never had skills on it (only
  // the course does) — fall back to the course's own skills so approving
  // it doesn't silently ship a certificate with no skills listed.
  const fallbackCourse = (window._coursesCache||[]).find(x=>x.id===c.course_id);
  document.getElementById('certSkillsAr').value = c.skills_ar || fallbackCourse?.skills_ar || '';
  document.getElementById('certSkillsEn').value = c.skills_en || fallbackCourse?.skills_en || '';
  document.getElementById('certGrade').value = c.overall_grade||'';
  document.getElementById('certLang').value = c.language||'ar';
  document.getElementById('certStatus').value = c.status||'pending';
  document.getElementById('certCode').value = c.verify_code||genCode();
  if (c.file_url){ const p=document.getElementById('certFilePreview'); p.src=c.file_url; p.style.display='block'; }
  document.getElementById('certCancelBtn').style.display='inline-flex';
  document.getElementById('certType').dispatchEvent(new Event('change'));
  if (c.cert_type==='track' && window._renderTrackCoursesBox) window._renderTrackCoursesBox(c.track_id, c.completed_courses||[]);
  window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteCert(id){
  if (!confirm('حذف هذه الشهادة؟')) return;
  try { await DB.remove('Certificates', id); toast('تم الحذف'); renderCertificatesTab(); } catch(e){ toast(friendlyError(e)); }
}

    document.getElementById('couponTrackField').style.display = e.target.value==='track' ? 'block' : 'none';

async function saveCoupon(){
  const btn = document.getElementById('couponSaveBtn');
  const code = document.getElementById('couponCode').value.trim().toUpperCase();
  if (!code){ toast('اكتب كود الخصم'); return; }
  const scope = document.getElementById('couponScope').value;
  btn.disabled = true; btn.textContent = '...جارٍ الحفظ';
  try {
    await DB.create('Coupons', {
      discount_percent: Number(document.getElementById('couponDiscount').value)||10,
      course_id: scope==='course' ? (document.getElementById('couponCourse').value||'') : '',
      track_id: scope==='track' ? (document.getElementById('couponTrack').value||'') : '',
      uses_left: Number(document.getElementById('couponUses').value)||50,
      active: 'TRUE',
    }, code);
    toast('تم الحفظ بنجاح'); renderCouponsTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
async function toggleCoupon(code, makeActive){
  try { await DB.update('Coupons', code, { active: makeActive?'TRUE':'FALSE' }); toast('تم التحديث'); renderCouponsTab(); } catch(e){ toast(friendlyError(e)); }
}
async function deleteCoupon(code){
  if (!confirm('حذف هذا الكود؟')) return;
  try { await DB.remove('Coupons', code); toast('تم الحذف'); renderCouponsTab(); } catch(e){ toast(friendlyError(e)); }
}

    <div class="panel">
      <input type="text" id="userSearchInput" placeholder="ابحث بالاسم أو البريد أو الهاتف..." style="width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); font-size:14px; font-family:inherit; margin-bottom:16px;">
      <div class="table-wrap"><table class="rows"><thead><tr><th></th><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>الجنس</th><th>المستوى</th><th>تاريخ التسجيل</th><th>الدور</th><th></th></tr></thead>

function renderUserRows(users){

/* ---- Moderation: ban (locks the platform in front of that user, showing
   only the logo, team email, and this reason) and progress reset. ---- */
async function banUser(uid){
  const reason = prompt('سبب الحظر (سيظهر للمستخدم على شاشة الحظر):');
  if (reason === null) return;
  if (!reason.trim()) { toast('اكتب سبب الحظر'); return; }
  try {
    await DB.update('Users', uid, { banned:true, ban_reason: reason.trim(), banned_at: new Date().toISOString() });
    toast('تم حظر المستخدم'); renderUsersTab();
  } catch(e){ toast(friendlyError(e)); }
}
async function unbanUser(uid){
  try {
    await DB.update('Users', uid, { banned:false, ban_reason:'' });
    toast('تم فك الحظر'); renderUsersTab();
  } catch(e){ toast(friendlyError(e)); }
}
async function resetUserProgress(uid){
  if (!confirm('مسح كل سجل تقدّم هذا المستخدم (المهام المكتملة + محاولات الاختبارات + مواضع التشغيل)؟\nلا يمكن التراجع عن ده.')) return;
  try {
    const [prog, attempts, media] = await Promise.all([
      DB.listAll('UserProgress','user_id',uid),
      DB.listAll('QuizAttempts','user_id',uid),
      DB.listAll('MediaProgress','user_id',uid).catch(()=>[]),
    ]);
    await Promise.all([
      ...prog.map(r=>DB.remove('UserProgress', r.id)),
      ...attempts.map(r=>DB.remove('QuizAttempts', r.id)),
      ...media.map(r=>DB.remove('MediaProgress', r.id)),
    ]);
    toast(`تم مسح ${prog.length+attempts.length+media.length} سجل`);
  } catch(e){ toast(friendlyError(e)); }
}
async function toggleAdmin(uid, role){
  try { await DB.update('Users', uid, { role }); toast('تم التحديث'); renderUsersTab(); } catch(e){ toast(friendlyError(e)); }
}
async function deleteUser(uid){
  if (!confirm('حذف بيانات هذا المستخدم من قاعدة البيانات؟\nملحوظة: ده بيحذف مستنده من Firestore بس — حساب الدخول نفسه في Firebase Authentication لازم يتحذف يدويًا من لوحة Authentication ← Users.')) return;
  try { await DB.remove('Users', uid); toast('تم الحذف'); renderUsersTab(); } catch(e){ toast(friendlyError(e)); }
}

/* ---- Student detail: full picture for one student (progress, quizzes, payments, certificates) ---- */
async function renderStudentDetail(uid){
  content.innerHTML = `<div class="content-head"><h1>${icon('book')} تفاصيل الطالب</h1></div><div class="empty">...جارٍ التحميل</div>`;
  try {
    const [user, progress, attempts, payments, certs, courses, lectures, tasks, courseBans] = await Promise.all([
      DB.get('Users', uid),
      DB.listAll('UserProgress', 'user_id', uid),
      DB.listAll('QuizAttempts', 'user_id', uid),
      DB.listAll('Payments', 'user_id', uid),
      DB.listAll('Certificates', 'user_id', uid),
      DB.listAll('Courses'), DB.listAll('Lectures'), DB.listAll('Tasks'),
      DB.listAll('CourseBans', 'user_id', uid),
    ]);
    if (!user){ content.innerHTML = `<div class="empty">المستخدم غير موجود</div>`; return; }
    const doneIds = new Set(progress.filter(p=>String(p.completed).toUpperCase()==='TRUE').map(p=>String(p.task_id)));
    const courseRows = courses.map(c=>{
      const cLectures = lectures.filter(l=>String(l.course_id)===String(c.id));
      const cTasks = tasks.filter(t=>cLectures.some(l=>String(l.id)===String(t.lecture_id)));
      if (!cTasks.length) return null;
      const doneCount = cTasks.filter(t=>doneIds.has(String(t.id))).length;
      const pct = Math.round(100*doneCount/cTasks.length);
      if (doneCount===0) return null; // only show courses the student actually started
      return `<tr><td>${escapeHtml(c.title_ar||'')}</td><td>${doneCount}/${cTasks.length}</td><td>${pct}%</td></tr>`;
    }).filter(Boolean).join('');

    content.innerHTML = `
      <div class="content-head">
        <h1>${icon('book')} ${escapeHtml(user.full_name||'طالب')}</h1>
        <button class="btn btn-ghost btn-sm" onclick="renderUsersTab()">← رجوع للمستخدمين</button>
      </div>

      <div class="panel">
        <h3>البيانات الأساسية</h3>
        <div class="field-row">
          <div><div class="hint">البريد</div><div>${escapeHtml(user.email||'—')}</div></div>
          <div><div class="hint">الهاتف</div><div>${escapeHtml(user.phone||'—')}</div></div>
          <div><div class="hint">الجنس</div><div>${user.gender==='male'?'ذكر':user.gender==='female'?'أنثى':'—'}</div></div>
          <div><div class="hint">المستوى</div><div>${escapeHtml(user.level||'—')}</div></div>
          <div><div class="hint">تاريخ التسجيل</div><div>${escapeHtml((user.created_at||'').slice(0,10)||'—')}</div></div>
        </div>
      </div>

      <div class="panel">
        <h3>تقدّم الدورات</h3>
        <div class="table-wrap"><table class="rows"><thead><tr><th>الدورة</th><th>مهام مكتملة</th><th>النسبة</th></tr></thead>
        <tbody>${courseRows || `<tr><td colspan="3" class="empty">لم يبدأ أي دورة بعد</td></tr>`}</tbody></table></div>
      </div>

      <div class="panel">
        <h3>محاولات الاختبارات (${attempts.length})</h3>
        <div class="table-wrap"><table class="rows"><thead><tr><th>النتيجة</th><th>ناجح؟</th><th>المحاولة رقم</th><th>التاريخ</th></tr></thead>
        <tbody>${attempts.length ? attempts.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).map(a=>`
          <tr><td>${a.score||0}%</td><td>${String(a.passed).toUpperCase()==='TRUE'?'✓':'✗'}</td><td>${a.attempt_no||1}</td><td style="font-size:12px; color:var(--ink-soft);">${escapeHtml((a.created_at||'').slice(0,10))}</td></tr>
        `).join('') : `<tr><td colspan="4" class="empty">لا توجد محاولات بعد</td></tr>`}</tbody></table></div>
      </div>

      <div class="panel">
        <h3>المدفوعات (${payments.length})</h3>
        <div class="table-wrap"><table class="rows"><thead><tr><th>الإثبات</th><th>الطريقة</th><th>الحالة</th><th>التاريخ</th></tr></thead>
        <tbody>${payments.length ? payments.map(p=>`
          <tr><td>${p.proof_url?`<a href="${escapeHtml(p.proof_url)}" target="_blank"><img class="thumb-sm" src="${escapeHtml(p.proof_url)}"></a>`:'—'}</td><td>${escapeHtml(p.method||'')}</td><td><span class="badge ${p.status||'pending'}">${p.status==='approved'?'مقبول':p.status==='rejected'?'مرفوض':'قيد المراجعة'}</span></td><td style="font-size:12px; color:var(--ink-soft);">${escapeHtml((p.created_at||'').slice(0,10))}</td></tr>
        `).join('') : `<tr><td colspan="4" class="empty">لا توجد مدفوعات بعد</td></tr>`}</tbody></table></div>
      </div>

      <div class="panel">
        <h3>الشهادات (${certs.length})</h3>
        <div class="table-wrap"><table class="rows"><thead><tr><th>الدورة</th><th>الرمز</th><th>الحالة</th></tr></thead>
        <tbody>${certs.length ? certs.map(c=>`
          <tr><td>${escapeHtml((courses.find(x=>x.id===c.course_id)||{}).title_ar||'—')}</td><td style="font-family:monospace;">${escapeHtml(c.verify_code||'')}</td><td><span class="badge ${c.status==='revoked'?'rejected':(c.status||'pending')}">${c.status==='issued'?'صادرة':c.status==='revoked'?'مُلغاة':'قيد المراجعة'}</span></td></tr>
        `).join('') : `<tr><td colspan="3" class="empty">لا توجد شهادات بعد</td></tr>`}</tbody></table></div>
      </div>

      <div class="panel">
        <h3>حظر من دورة معيّنة</h3>
        <div class="hint" style="margin-bottom:12px;">بيمنع الطالب ده تحديدًا من فتح محتوى الدورة دي، حتى لو كان مشترك ومدفوعها.</div>
        <div class="field-row">
          <div class="field" id="courseBanSelectField"><label>الدورة</label><select id="courseBanSelect">${courses.map(c=>`<option value="${c.id}">${escapeHtml(c.title_ar||'')}</option>`).join('')}</select></div>
          <div class="field"><label>السبب (اختياري)</label><input type="text" id="courseBanReason"></div>
        </div>
        <button class="btn btn-danger btn-sm" onclick="banUserFromCourse('${uid}')">حظر من هذه الدورة</button>
        <div class="table-wrap" style="margin-top:16px;"><table class="rows"><thead><tr><th>الدورة</th><th>السبب</th><th></th></tr></thead>
        <tbody id="courseBansRows">${courseBans.length ? courseBans.map(b=>`
          <tr><td>${escapeHtml((courses.find(x=>x.id===b.course_id)||{}).title_ar||'—')}</td><td style="font-size:12.5px;">${escapeHtml(b.reason||'—')}</td>
          <td><button class="btn btn-ghost btn-sm" onclick="unbanUserFromCourse('${b.id}','${uid}')">فك الحظر</button></td></tr>
        `).join('') : `<tr><td colspan="3" class="empty">مش محظور من أي دورة</td></tr>`}</tbody></table></div>
      </div>`;
  } catch(e){ content.innerHTML = `<div class="empty">${escapeHtml(friendlyError(e))}</div>`; }
}
async function banUserFromCourse(uid){
  const course_id = document.getElementById('courseBanSelect').value;
  const reason = document.getElementById('courseBanReason').value.trim();
  if (!course_id){ toast('اختر الدورة'); return; }
  try {
    await DB.create('CourseBans', { user_id: uid, course_id, reason, banned_at: new Date().toISOString() });
    toast('تم الحظر من الدورة'); renderStudentDetail(uid);
  } catch(e){ toast(friendlyError(e)); }
}
async function unbanUserFromCourse(banId, uid){
  try { await DB.remove('CourseBans', banId); toast('تم فك الحظر'); renderStudentDetail(uid); }
  catch(e){ toast(friendlyError(e)); }
}

  document.getElementById('annTitle').value = a.title_ar||'';

  document.getElementById('annLink').value = a.link_url||'';
  document.getElementById('annActive').value = a.active||'TRUE';
  document.getElementById('annCancelBtn').style.display='inline-flex';
  window.scrollTo({top:0, behavior:'smooth'});
}

}

        <div class="field"><label>الموعد *</label><input type="datetime-local" id="liveTime"></div>
        <div class="field"><label>رابط الانضمام</label><input type="url" id="liveUrl" placeholder="https://..."></div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="liveSaveBtn">${icon('plus')} حفظ</button>
        <button class="btn btn-ghost" id="liveCancelBtn" style="display:none;">إلغاء التعديل</button>
      </div>
    </div>
    <div class="panel">
      <div class="table-wrap"><table class="rows"><thead><tr><th>العنوان</th><th>الموعد</th><th></th></tr></thead>
      <tbody>${items.length ? items.sort((a,b)=>(a.start_time||'').localeCompare(b.start_time||'')).map(s=>`
        <tr>
          <td>${escapeHtml(s.title_ar||'')}</td>
          <td style="font-size:12.5px; color:var(--ink-soft);">${s.start_time ? new Date(s.start_time).toLocaleString('ar-EG') : '—'}</td>
          <td class="row-actions">
            <button class="btn btn-ghost btn-sm" onclick="editLiveSession('${s.id}')">${icon('edit')}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteLiveSession('${s.id}')">${icon('trash')}</button>
          </td>
        </tr>`).join('') : `<tr><td colspan="3" class="empty">لا توجد جلسات بعد</td></tr>`}</tbody></table></div>
    </div>`;
  document.getElementById('liveSaveBtn').addEventListener('click', saveLiveSession);
  document.getElementById('liveCancelBtn').addEventListener('click', ()=>renderLiveSessionsTab());
}
async function saveLiveSession(){
  const btn = document.getElementById('liveSaveBtn');
  const title_ar = document.getElementById('liveTitle').value.trim();
  const start_time_local = document.getElementById('liveTime').value;
  if (!title_ar || !start_time_local){ toast('اكتب العنوان وحدد الموعد'); return; }
  btn.disabled = true; btn.textContent = '...جارٍ الحفظ';
  try {
    const editId = document.getElementById('liveEditId').value;
    const data = {
      title_ar, description_ar: document.getElementById('liveDesc').value.trim(),
      start_time: new Date(start_time_local).toISOString(),
      meeting_url: document.getElementById('liveUrl').value.trim(),
    };
    if (editId) await DB.update('LiveSessions', editId, data);
    else await DB.create('LiveSessions', data);
    toast('تم الحفظ بنجاح'); renderLiveSessionsTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
function editLiveSession(id){
  const s = (window._liveCache||[]).find(x=>x.id===id); if (!s) return;
  document.getElementById('liveFormTitle').textContent = 'تعديل الجلسة';
  document.getElementById('liveEditId').value = id;
  document.getElementById('liveTitle').value = s.title_ar||'';
  document.getElementById('liveDesc').value = s.description_ar||'';
  if (s.start_time){
    const d = new Date(s.start_time);
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('liveTime').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  document.getElementById('liveUrl').value = s.meeting_url||'';
  document.getElementById('liveCancelBtn').style.display='inline-flex';
  window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteLiveSession(id){
  if (!confirm('حذف هذه الجلسة؟')) return;
  try { await DB.remove('LiveSessions', id); toast('تم الحذف'); renderLiveSessionsTab(); } catch(e){ toast(friendlyError(e)); }
}

/* =====================================================================
   QUESTIONS (feature 4 — student Q&A per lecture, admin answers)
   ===================================================================== */
async function renderQuestionsTab(){
  const [questions, lectures] = await Promise.all([DB.listAll('Questions'), DB.listAll('Lectures')]);
  content.innerHTML = `
    <div class="content-head"><h1>${icon('book')} أسئلة الطلاب</h1></div>
    <div class="panel">
      ${questions.length ? questions.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).map(q=>`
        <div class="qblock">
          <div class="qhead">
            <div>
              <strong style="font-size:13.5px;">${escapeHtml(q.user_name||'طالب')}</strong>
              <span style="font-size:11.5px; color:var(--ink-soft);"> · ${escapeHtml((lectures.find(l=>l.id===q.lecture_id)||{}).title_ar||'محاضرة')} · ${escapeHtml((q.created_at||'').slice(0,10))}</span>
            </div>
            <button class="btn btn-danger btn-sm" onclick="deleteQuestion('${q.id}')">${icon('trash')}</button>
          </div>
          <p style="font-size:13.5px; margin-bottom:10px;">${escapeHtml(q.question||'')}</p>
          <div class="field"><textarea id="ans-${q.id}" placeholder="اكتب الرد هنا...">${escapeHtml(q.answer||'')}</textarea></div>
          <button class="btn btn-primary btn-sm" onclick="answerQuestion('${q.id}')">${icon('check')} حفظ الرد</button>
          ${q.answer ? `<span class="badge approved" style="margin-right:8px;">تم الرد</span>` : `<span class="badge pending" style="margin-right:8px;">بانتظار الرد</span>`}
        </div>`).join('') : `<div class="empty">لا توجد أسئلة بعد</div>`}
    </div>`;
}
async function answerQuestion(id){
  const answer = document.getElementById(`ans-${id}`).value.trim();
  if (!answer){ toast('اكتب الرد أولًا'); return; }
  try { await DB.update('Questions', id, { answer, answered:'TRUE' }); toast('تم حفظ الرد'); renderQuestionsTab(); } catch(e){ toast(friendlyError(e)); }
}
async function deleteQuestion(id){
  if (!confirm('حذف هذا السؤال؟')) return;
  try { await DB.remove('Questions', id); toast('تم الحذف'); renderQuestionsTab(); } catch(e){ toast(friendlyError(e)); }
}

/* =====================================================================
   LECTURE RESOURCES (feature — downloadable files per lecture)
   ===================================================================== */
async function renderResourcesTab(){
  const [resources, lectures] = await Promise.all([DB.listAll('Resources'), DB.listAll('Lectures')]);
  window._resourcesCache = resources; window._lecturesCacheR = lectures;
  const lectureOptions = lectures.map(l=>`<option value="${l.id}">${escapeHtml(l.title_ar||'')}</option>`).join('');
  content.innerHTML = `
    <div class="content-head"><h1>${icon('book')} ملفات ومصادر المحاضرات</h1></div>
    <div class="panel">
      <h3 id="resFormTitle">إضافة ملف جديد</h3>
      <input type="hidden" id="resEditId">
      <div class="field"><label>المحاضرة *</label><select id="resLecture">${lectureOptions || '<option value="">لا توجد محاضرات — أضف محاضرة أولًا</option>'}</select></div>
      <div class="field"><label>اسم الملف *</label><input type="text" id="resTitle" placeholder="مثال: ملخص المحاضرة PDF"></div>
      <div class="field"><label>رابط الملف *</label><input type="url" id="resUrl" placeholder="https://..."></div>
      <div class="hint" style="margin-bottom:14px;">ارفع الملف على أي مكان (Google Drive، ImgBB للصور، إلخ) والصق رابط التحميل المباشر هنا.</div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="resSaveBtn">${icon('plus')} حفظ</button>
        <button class="btn btn-ghost" id="resCancelBtn" style="display:none;">إلغاء التعديل</button>
      </div>
    </div>
    <div class="panel">
      <div class="table-wrap"><table class="rows"><thead><tr><th>اسم الملف</th><th>المحاضرة</th><th></th></tr></thead>
      <tbody>${resources.length ? resources.map(r=>`
        <tr>
          <td>${escapeHtml(r.title||'')}</td>
          <td style="font-size:12.5px; color:var(--ink-soft);">${escapeHtml((lectures.find(l=>l.id===r.lecture_id)||{}).title_ar||'—')}</td>
          <td class="row-actions">
            <a class="btn btn-ghost btn-sm" href="${escapeHtml(r.file_url||'#')}" target="_blank" rel="noopener">فتح</a>
            <button class="btn btn-ghost btn-sm" onclick="editResource('${r.id}')">${icon('edit')}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteResource('${r.id}')">${icon('trash')}</button>
          </td>
        </tr>`).join('') : `<tr><td colspan="3" class="empty">لا توجد ملفات بعد</td></tr>`}</tbody></table></div>
    </div>`;
  document.getElementById('resSaveBtn').addEventListener('click', saveResource);
  document.getElementById('resCancelBtn').addEventListener('click', ()=>renderResourcesTab());
}
async function saveResource(){
  const btn = document.getElementById('resSaveBtn');
  const title = document.getElementById('resTitle').value.trim();
  const lecture_id = document.getElementById('resLecture').value;
  const file_url = document.getElementById('resUrl').value.trim();
  if (!title || !lecture_id || !file_url){ toast('أكمل كل الحقول'); return; }
  btn.disabled = true; btn.textContent = '...جارٍ الحفظ';
  try {
    const editId = document.getElementById('resEditId').value;
    const data = { title, lecture_id, file_url, created_at:new Date().toISOString() };
    if (editId) await DB.update('Resources', editId, data);
    else await DB.create('Resources', data);
    toast('تم الحفظ بنجاح'); renderResourcesTab();
  } catch(e){ toast(friendlyError(e)); btn.disabled=false; btn.innerHTML = `${icon('plus')} حفظ`; }
}
function editResource(id){
  const r = (window._resourcesCache||[]).find(x=>x.id===id); if (!r) return;
  document.getElementById('resFormTitle').textContent = 'تعديل الملف';
  document.getElementById('resEditId').value = id;
  document.getElementById('resLecture').value = r.lecture_id||'';
  document.getElementById('resTitle').value = r.title||'';
  document.getElementById('resUrl').value = r.file_url||'';
  document.getElementById('resCancelBtn').style.display='inline-flex';
  window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteResource(id){
  if (!confirm('حذف هذا الملف؟')) return;
  try { await DB.remove('Resources', id); toast('تم الحذف'); renderResourcesTab(); } catch(e){ toast(friendlyError(e)); }
}

/* =====================================================================
   COURSE REVIEWS (moderation)
   ===================================================================== */
async function renderReviewsTab(){
  const [reviews, courses] = await Promise.all([DB.listAll('Reviews'), DB.listAll('Courses')]);
  content.innerHTML = `
    <div class="content-head"><h1>${icon('book')} تقييمات الدورات</h1></div>
    <div class="panel">
      <div class="table-wrap"><table class="rows"><thead><tr><th>الطالب</th><th>الدورة</th><th>التقييم</th><th>التعليق</th><th></th></tr></thead>
      <tbody>${reviews.length ? reviews.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).map(r=>`
        <tr>
          <td>${escapeHtml(r.user_name||'')}</td>
          <td style="font-size:12.5px; color:var(--ink-soft);">${escapeHtml((courses.find(c=>c.id===r.course_id)||{}).title_ar||'—')}</td>
          <td style="color:var(--gold);">${'★'.repeat(r.rating||0)}${'☆'.repeat(5-(r.rating||0))}</td>
          <td style="font-size:12.5px; max-width:220px;">${escapeHtml(r.comment||'')}</td>
          <td class="row-actions"><button class="btn btn-danger btn-sm" onclick="deleteReview('${r.id}')">${icon('trash')}</button></td>
        </tr>`).join('') : `<tr><td colspan="5" class="empty">لا توجد تقييمات بعد</td></tr>`}</tbody></table></div>
    </div>`;
}
async function deleteReview(id){
  if (!confirm('حذف هذا التقييم؟')) return;
  try { await DB.remove('Reviews', id); toast('تم الحذف'); renderReviewsTab(); } catch(e){ toast(friendlyError(e)); }
}

/* =====================================================================
   WAITLIST (students interested in not-yet-published courses)
   ===================================================================== */
async function renderWaitlistTab(){
  const [entries, courses] = await Promise.all([DB.listAll('Waitlist'), DB.listAll('Courses')]);
  const grouped = {};
  entries.forEach(e => { (grouped[e.course_id] = grouped[e.course_id] || []).push(e); });
  content.innerHTML = `
    <div class="content-head"><h1>${icon('book')} قوائم الانتظار</h1></div>
    ${Object.keys(grouped).length ? Object.entries(grouped).map(([courseId, list]) => `
      <div class="panel">
        <h3>${escapeHtml((courses.find(c=>c.id===courseId)||{}).title_ar||'دورة محذوفة')} <span style="color:var(--ink-soft); font-weight:400; font-size:12.5px;">(${list.length} مهتم)</span></h3>
        <div class="table-wrap"><table class="rows"><thead><tr><th>البريد</th><th>التاريخ</th></tr></thead>
        <tbody>${list.map(e=>`<tr><td style="font-size:12.5px;">${escapeHtml(e.user_email||'')}</td><td style="font-size:12px; color:var(--ink-soft);">${escapeHtml((e.created_at||'').slice(0,10))}</td></tr>`).join('')}</tbody></table></div>
      </div>`).join('') : `<div class="panel"><div class="empty">لا توجد طلبات انتظار بعد</div></div>`}
    `;
}

/* =====================================================================
   RETAKE REQUESTS (students out of quiz attempts requesting more)
   ===================================================================== */
async function renderRetakesTab(){
  const requests = await DB.listAll('RetakeRequests');
  content.innerHTML = `
    <div class="content-head"><h1>${icon('book')} طلبات إعادة الاختبار</h1></div>
    <div class="panel">
      <div class="table-wrap"><table class="rows"><thead><tr><th>الطالب</th><th>الاختبار</th><th>التاريخ</th><th>الحالة</th><th></th></tr></thead>
      <tbody>${requests.length ? requests.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).map(r=>`
        <tr>
          <td>${escapeHtml(r.user_name||'')}<br><span style="font-size:11px; color:var(--ink-soft);">${escapeHtml(r.user_email||'')}</span></td>
          <td style="font-size:12.5px;">${escapeHtml(r.task_title||r.task_id||'')}</td>
          <td style="font-size:12px; color:var(--ink-soft);">${escapeHtml((r.created_at||'').slice(0,10))}</td>
          <td><span class="badge ${r.status==='approved'?'approved':r.status==='rejected'?'rejected':'pending'}">${r.status==='approved'?'مقبول':r.status==='rejected'?'مرفوض':'قيد المراجعة'}</span></td>
          <td class="row-actions">
            ${r.status==='pending' ? `
              <button class="btn btn-primary btn-sm" onclick="setRetakeStatus('${r.id}','approved')">${icon('check')} قبول</button>
              <button class="btn btn-ghost btn-sm" onclick="setRetakeStatus('${r.id}','rejected')">رفض</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="deleteRetake('${r.id}')">${icon('trash')}</button>
          </td>
        </tr>`).join('') : `<tr><td colspan="5" class="empty">لا توجد طلبات بعد</td></tr>`}</tbody></table></div>
    </div>`;
}
async function setRetakeStatus(id, status){
  try {
    const req = (await DB.listAll('RetakeRequests')).find(r=>r.id===id);
    await DB.update('RetakeRequests', id, { status });
    if (req) await DB.create('Notifications', {
      user_id: req.user_id,
      title: status==='approved' ? 'تم قبول طلب إعادة الاختبار' : 'تم رفض طلب إعادة الاختبار',
      message: status==='approved' ? `تقدر تعيد اختبار "${req.task_title||''}" الآن` : `طلبك لإعادة اختبار "${req.task_title||''}" اتُرفض`,
      link: `quiz/${req.task_id}`, read:'FALSE', created_at:new Date().toISOString(),
    });
    toast('تم التحديث'); renderRetakesTab();
  } catch(e){ toast(friendlyError(e)); }
}
async function deleteRetake(id){
  if (!confirm('حذف هذا الطلب؟')) return;
  try { await DB.remove('RetakeRequests', id); toast('تم الحذف'); renderRetakesTab(); } catch(e){ toast(friendlyError(e)); }
}

loadTab();
