# Federation rejects this workflow run numbers 1-9 permanently after recovery.
name: Deploy Sarmad to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: sarmad-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/676932025599/locations/global/workloadIdentityPools/github-sarmad-safe/providers/github-main-safe
          token_format: access_token
          project_id: saemad-8a204
          service_account: github-hosting-sarmad-safe@saemad-8a204.iam.gserviceaccount.com
      - name: Stage only site files
        run: |
          rm -rf public
          mkdir public
          cp index.html public/index.html
          cp robots.txt public/robots.txt
          cp sitemap.xml public/sitemap.xml
          test "$(find public -type f | wc -l)" -eq 3
          test "$(find public -type f | sort)" = "$(printf 'public/index.html\npublic/robots.txt\npublic/sitemap.xml')"
          test ! -L public/index.html
      - name: Deploy Hosting only
        run: npx --yes firebase-tools@15.37.0 deploy --only hosting --project saemad-8a204 --non-interactive
