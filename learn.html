<style>
:root{
  --bg:#fbf7ec;--bg2:#f3ecd9;--bg3:#e9dfc5;--fg:#1b2b25;--muted:#68705f;
  --line:#e6dcc0;--line2:#cdbf98;--accent:#0f6b56;--accent-soft:#e2eee3;
  --accent-ink:#fbf7ec;--gold:#b8892b;--ok:#2e7d32;--warn:#b45309;
  --card:#ffffff;--shadow:0 10px 30px rgba(27,43,37,.10),0 2px 6px rgba(27,43,37,.06);
  --r:16px;--r-sm:10px;
  --f:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"Noto Kufi Arabic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f);color:var(--fg);background:var(--bg);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px 16px 40px;
  background-image:radial-gradient(900px 420px at 80% -10%,var(--accent-soft),transparent 70%),
                   radial-gradient(700px 380px at 0% 110%,var(--bg2),transparent 70%);
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:430px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin:0 0 18px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 4px 12px rgba(15,107,86,.25)}
.brandmark{display:flex;flex-direction:column;align-items:center;gap:6px}
.brandmark img{display:block;width:176px;height:auto}
.brandmark span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.brand span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800}
.card p.sub{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.7}
label{display:block;font-size:12.5px;font-weight:700;margin:0 0 6px;color:var(--fg)}
input{width:100%;padding:13px 14px;font-size:15px;font-family:var(--f);color:var(--fg);
  background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);outline:none;transition:.15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
input::placeholder{color:#9aa294}
.code-input{letter-spacing:10px;text-align:center;font-size:22px;font-weight:800;direction:ltr;font-family:ui-monospace,Menlo,Consolas,monospace}
.btn{width:100%;margin-top:14px;padding:13px 16px;font-size:15px;font-weight:800;font-family:var(--f);
  color:var(--accent-ink);background:var(--accent);border:0;border-radius:var(--r-sm);cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line2);font-weight:700}
.row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.mini{font-size:12px;color:var(--muted)}
.msg{margin-top:14px;padding:10px 12px;border-radius:var(--r-sm);font-size:13px;line-height:1.6;display:none}
.msg.err{display:block;background:#fdf1ee;border:1px solid #f3d3cb;color:#9c2f16}
.msg.ok{display:block;background:var(--accent-soft);border:1px solid #c9e0cd;color:#145c46}
.divider{display:flex;align-items:center;gap:10px;margin:20px 0 6px;color:var(--muted);font-size:11.5px;font-weight:700}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.hidden{display:none!important}
.foot{text-align:center;margin:16px 0 0;font-size:12px;color:var(--muted);line-height:1.8}
.foot a{color:var(--accent);text-decoration:none;font-weight:700}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.7}
.lang{position:fixed;top:14px;inset-inline-start:14px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font:inherit;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
@media (max-width:380px){.card{padding:18px}}

.dash{width:100%}
body.tall{align-items:flex-start;padding-top:26px;padding-bottom:26px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dhead h2{margin:0;font-size:17px}
.statrow{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.stat span{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
.stat b{font-size:15px;font-weight:800}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:800}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.item .tt{flex:1;min-width:0}
.item .tt b{display:block;font-size:13.5px;font-weight:700;line-height:1.5}
.item .tt span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.item a{font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap}
.empty{font-size:12.5px;color:var(--muted);line-height:1.8}
.skel{height:44px;border-radius:10px;background:var(--bg2);margin-top:8px;animation:p 1.2s infinite}
@keyframes p{0%,100%{opacity:.55}50%{opacity:.9}}
</style>
</head>

  function applyLang(){
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    $("langBtn").textContent = lang === "ar" ? "EN" : "ع";
    $("tSub").textContent = t("sub");
    $("tTitle").textContent = t("title"); $("tDesc").textContent = t("desc");
    $("tEmailLbl").textContent = t("emailLbl"); $("tCodeLbl").textContent = t("codeLbl");
    $("tPwLbl").textContent = t("pwLbl"); $("tHint").textContent = t("hint");
    sendBtn.textContent = t("send"); verifyBtn.textContent = t("verify");
    $("backBtn").textContent = t("back"); resendBtn.textContent = t("resend");
    $("tOr").textContent = t("or"); $("pwToggle").textContent = t("pwToggle");
    pwBtn.textContent = t("pwBtn"); $("tHelp").textContent = t("help");
  }

  function show(kind, text){ elMsg.className = "msg " + kind; elMsg.textContent = text; }
  function clearMsg(){ elMsg.className = "msg"; elMsg.textContent = ""; }
  function lock(b){ busy = b; sendBtn.disabled = b; verifyBtn.disabled = b; resendBtn.disabled = b; pwBtn.disabled = b; }

  function post(path, body){
    return fetch(API + path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json().catch(function(){ return {}; }); });
  }

  var COURSES = {"cyber1": {"ar": "أساسيات الأمن السيبراني للمطورين", "en": "Cybersecurity Essentials for Developers", "status": "open"}, "front1": {"ar": "واجهات سريعة ومتجاوبة بالعربية والإنجليزية", "en": "Fast Bilingual Responsive Interfaces", "status": "open"}, "pay1": {"ar": "ربط بوابات الدفع بأمان", "en": "Integrating Payment Gateways Safely", "status": "soon"}};
  function goHome(){ location.replace(HOME); }
  function fmtDate(ms){ try { return new Date(ms).toLocaleDateString(lang === "ar" ? "ar-EG" : "en-GB", { day:"numeric", month:"long", year:"numeric" }); } catch(e){ return ""; } }
  function el(tag, cls, html){ var d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }
  function courseTitle(id){ var c = COURSES[id]; return c ? (lang === "ar" ? c.ar : c.en) : id; }

  function showDash(u){
    document.querySelector(".card").classList.add("hidden");
    document.querySelector(".brand").classList.add("hidden");
    $("dash").classList.remove("hidden");
    document.body.classList.add("tall");
    var db = firebase.firestore();
    var uref = db.collection("users").doc(u.uid);
    $("dEmail").textContent = u.email || "";
    uref.get().then(function(s){
      var d = s.exists ? s.data() : {};
      $("dName").textContent = (lang === "ar" ? "أهلًا، " : "Hi, ") + (d.name || (u.email || "").split("@")[0]);
    }).catch(function(){ $("dName").textContent = (lang === "ar" ? "أهلًا" : "Hi"); });

    Promise.all([
      uref.collection("enroll").get().catch(function(){ return null; }),
      uref.collection("progress").get().catch(function(){ return null; }),
      db.collection("orders").where("userId","==",u.uid).get().catch(function(){ return null; }),
      db.collection("certs").where("userId","==",u.uid).get().catch(function(){ return null; })
    ]).then(function(res){
      var enr = {}, prog = {}, orders = [], certs = [];
      if (res[0]) res[0].forEach(function(d){ enr[d.id] = 1; });
      if (res[1]) res[1].forEach(function(d){ var ls = (d.data().lessons)||{}; var n = 0; Object.keys(ls).forEach(function(k){ if (ls[k] && ls[k].done) n++; }); prog[d.id] = { done: n, touched: Object.keys(ls).length }; });
      if (res[2]) res[2].forEach(function(d){ orders.push(Object.assign({ id: d.id }, d.data())); });
      if (res[3]) res[3].forEach(function(d){ certs.push(Object.assign({ id: d.id }, d.data())); });

      var sub = null;
      orders.forEach(function(o){
        if (o.status !== "paid") return;
        if (o.courseId) enr[o.courseId] = 1;
        if (o.plan){ var at = o.paidAt || o.at; var dt = new Date(at && at.seconds ? at.seconds*1000 : at); dt.setMonth(dt.getMonth() + (o.plan === "pro" ? 6 : 3)); var until = dt.getTime(); if (until > Date.now() && (!sub || until > sub.until)) sub = { plan: o.plan, until: until }; }
      });

      var subEl = $("dSub");
      if (sub){ subEl.textContent = (sub.plan === "pro" ? "برو" : "بلس") + " · " + fmtDate(sub.until); subEl.style.fontSize = "12.5px"; }
      else { subEl.textContent = lang === "ar" ? "بدون اشتراك" : "None"; subEl.style.fontSize = "12.5px"; }

      var ids = Object.keys(enr).filter(function(id){ return COURSES[id] || prog[id]; });
      $("dCourses").textContent = String(ids.length);
      var cl = $("dCourseList"); cl.innerHTML = "";
      if (!ids.length){ cl.appendChild(el("div","empty", lang === "ar" ? "لسه مسجلتش في كورس. ابدأ من صفحة المنصة." : "You haven't joined a course yet.")); }
      ids.forEach(function(id){
        var p = prog[id] || { done: 0 };
        var row = el("div","item");
        row.appendChild(el("div","ic","▶"));
        var tt = el("div","tt");
        tt.appendChild(el("b",null,courseTitle(id)));
        tt.appendChild(el("span",null, (lang === "ar" ? p.done + " درس مكتمل" : p.done + " lessons done")));
        row.appendChild(tt);
        var a = el("a",null, lang === "ar" ? "متابعة" : "Open");
        a.href = "/#course-" + id;
        row.appendChild(a);
        cl.appendChild(row);
      });

      $("dCerts").textContent = String(certs.length);
      var cl2 = $("dCertList"); cl2.innerHTML = "";
      if (!certs.length){ cl2.appendChild(el("div","empty", lang === "ar" ? "مفيش شهادات لسه. خلص كورس عشان تستحق شهادتك." : "No certificates yet. Finish a course to earn one.")); }
      certs.forEach(function(c){
        var row = el("div","item");
        row.appendChild(el("div","ic","✦"));
        var tt = el("div","tt");
        tt.appendChild(el("b",null, (lang === "ar" ? (c.courseAr || "") : (c.courseEn || c.courseAr || "")) || c.courseId));
        tt.appendChild(el("span",null, c.id + (c.status === "pending" ? (lang === "ar" ? " · قيد المراجعة" : " · pending") : "")));
        row.appendChild(tt);
        var a = el("a",null, lang === "ar" ? "عرض" : "View");
        a.href = "/#cert-" + c.id;
        row.appendChild(a);
        cl2.appendChild(row);
      });
    }).catch(function(){
      $("dCourseList").innerHTML = '<div class="empty">' + (lang === "ar" ? "تعذر تحميل البيانات. افتح المنصة." : "Could not load your data.") + '</div>';
    });
  }
  function showLogin(){
    $("dash").classList.add("hidden");
    document.querySelector(".card").classList.remove("hidden");
    document.querySelector(".brand").classList.remove("hidden");
    document.body.classList.remove("tall");
  }

  function startResend(){
    var left = 60;
    if (timer) clearInterval(timer);
    resendBtn.disabled = true;
    resendBtn.textContent = t("resendIn") + left + t("sec");
    timer = setInterval(function(){
      left--;
      if (left <= 0){
        clearInterval(timer); timer = null;
        resendBtn.disabled = false; resendBtn.textContent = t("resend");
        return;
      }
      resendBtn.textContent = t("resendIn") + left + t("sec");
    }, 1000);
  }

  function sendCode(){
    if (busy) return;
    var em = (elEmail.value || "").trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { show("err", t("badEmail")); elEmail.focus(); return; }
    clearMsg(); lock(true); sendBtn.textContent = "...";
    post("/otplogin/start", { email: em }).then(function(j){
      lock(false); sendBtn.textContent = t("send");
      if (!j || !j.ok) { show("err", t("net")); return; }
      if (!j.sent && j.why === "slow") { show("err", t("slow")); return; }
      email = em;
      stepEmail.classList.add("hidden"); stepCode.classList.remove("hidden");
      show("ok", t("sent") + em);
      startResend(); elCode.focus();
    }).catch(function(){ lock(false); sendBtn.textContent = t("send"); show("err", t("net")); });
  }

  function verify(){
    if (busy) return;
    var code = (elCode.value || "").replace(/\D/g, "");
    if (code.length !== 6) { show("err", t("enter")); elCode.focus(); return; }
    clearMsg(); lock(true); verifyBtn.textContent = "...";
    post("/otplogin/check", { email: email, code: code }).then(function(j){
      if (j && j.ok && j.token){
        return auth.signInWithCustomToken(j.token).then(function(){ goHome(); });
      }
      lock(false); verifyBtn.textContent = t("verify");
      if (!j || !j.ok){
        var w = (j && j.why) || "";
        if (w === "expired") show("err", t("expired"));
        else if (w === "bad") show("err", t("wrong"));
        else if (w === "lookup") show("err", t("noAcct"));
        else show("err", t("net"));
      }
    }).catch(function(e){
      lock(false); verifyBtn.textContent = t("verify");
      show("err", t("net"));
    });
  }

  function pwLogin(){
    if (busy) return;
    var em = (elEmail.value || "").trim().toLowerCase(), pw = elPw.value || "";
    if (!em || !pw) { show("err", t("pwBad")); return; }
    clearMsg(); lock(true); pwBtn.textContent = "...";
    auth.signInWithEmailAndPassword(em, pw).then(function(){ goHome(); }).catch(function(e){
      lock(false); pwBtn.textContent = t("pwBtn");
      var c = (e && e.code) || "";
      if (/user-not-found/.test(c)) show("err", t("pwNo"));
      else show("err", t("pwBad"));
    });
  }

  sendBtn.addEventListener("click", sendCode);
  elEmail.addEventListener("keydown", function(e){ if (e.key === "Enter") sendCode(); });
  verifyBtn.addEventListener("click", verify);
  elCode.addEventListener("keydown", function(e){ if (e.key === "Enter") verify(); });
  elCode.addEventListener("input", function(){
    var v = (elCode.value || "").replace(/\D/g, "").slice(0, 6);
    if (elCode.value !== v) elCode.value = v;
  });
  resendBtn.addEventListener("click", function(){ if (busy) return; sendCode(); });
  $("backBtn").addEventListener("click", function(){
    stepCode.classList.add("hidden"); stepEmail.classList.remove("hidden");
    elCode.value = ""; clearMsg(); elEmail.focus();
  });
  $("pwToggle").addEventListener("click", function(){ stepPw.classList.toggle("hidden"); if (!stepPw.classList.contains("hidden")) elPw.focus(); });
  pwBtn.addEventListener("click", pwLogin);
  elPw.addEventListener("keydown", function(e){ if (e.key === "Enter") pwLogin(); });
  $("langBtn").addEventListener("click", function(){
    lang = lang === "ar" ? "en" : "ar"; applyLang();
    try { localStorage.setItem("learn_lang", lang); } catch (e) {}
  });

  try { var saved = localStorage.getItem("learn_lang"); if (saved === "en" || saved === "ar") lang = saved; } catch (e) {}
  applyLang();

  $("outBtn").addEventListener("click", function(){ auth.signOut().then(function(){ showLogin(); }); });
  auth.onAuthStateChanged(function(u){ if (u) showDash(u); else showLogin(); });
})();
</script>
</body>
</html>
